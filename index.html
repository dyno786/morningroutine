}
function exLoad(p,autoplay){
  hush(); X.p=p; X.phase=0; X.playing=false;
  exShell();
  if(autoplay) setTimeout(exStart,400);
}
function exPaint(){
  const d=X.def, S=d.steps(X.p);
  el("xSay").innerHTML=S[X.phase].cap;
  d.apply(el("xStage"),X.p,X.phase);
  const w=el("xWritten"), inner=d.extra(X.p,X.phase);
  w.innerHTML=inner; w.classList.toggle("on",!!inner);
  el("xPips").innerHTML=S.map((_,i)=>`<span class="pip ${i===X.phase?"on":i<X.phase?"past":""}"></span>`).join("");
  el("xPrev").disabled=X.phase===0;
  el("xNext").disabled=X.phase===S.length-1;
}
function exGo(n,talk){
  const S=X.def.steps(X.p);
  X.phase=Math.max(0,Math.min(S.length-1,n));
  exPaint();
  if(talk!==false) speak(S[X.phase].say, X.playing?()=>{
    if(!X.playing) return;
    if(X.phase<S.length-1) exGo(X.phase+1); else exStop();
  }:null);
}
function exStop(){ X.playing=false; hush(); const b=el("xPlay"); if(b){b.textContent="▶  Play";b.classList.remove("pause")} }
function exStart(){
  X.playing=true;
  const b=el("xPlay"); b.textContent="❚❚  Pause"; b.classList.add("pause");
  if(X.phase===X.def.steps(X.p).length-1) X.phase=0;
  exGo(X.phase);
}
function exQuiz(){
  const q=X.def.quiz(X.p,X.def.presets);
  const opts=q.opts.slice().sort(()=>Math.random()-.5);
  el("xQuiz").innerHTML=`<div class="qask">${q.ask}</div>
    <div class="qopts">${opts.map(o=>`<button class="qopt" data-v="${o}">${o}</button>`).join("")}</div>
    <div class="qmsg" id="xQmsg"></div>`;
  document.querySelectorAll("#xQuiz .qopt").forEach(btn=>btn.onclick=()=>{
    const ok=String(btn.dataset.v)===String(q.ans);
    btn.classList.add(ok?"right":"wrong");
    const m=el("xQmsg");
    m.className="qmsg on "+(ok?"y":"n");
    m.innerHTML=(ok?`<b>Yes.</b> ${q.why}`:`<b>Not that one.</b> ${q.miss}`)+
      ` <button class="chip" id="xSee" style="margin-top:10px">Watch it drawn</button>`;
    if(ok) document.querySelectorAll("#xQuiz .qopt").forEach(x=>x.disabled=true);
    el("xSee").onclick=()=>{exLoad(q.next,true);window.scrollTo({top:0,behavior:"smooth"})};
  });
}


/* =======================================================================
   SCAFFOLDS — after two wrong tries, break the question into small steps.
   Never states the answer. Asks until he works it out himself.
   ======================================================================= */
function nOpts(ans,cands){
  const out=[ans];
  const add=c=>{ if(out.length<4&&Number.isFinite(c)&&c>=0&&!out.some(v=>Math.abs(v-c)<1e-9)) out.push(Math.round(c*1000)/1000); };
  cands.forEach(add);
  [ans+1,ans+2,ans+10,ans*2].forEach(add);   // always pad to four
  return out;
}
const fmtN=(v,u)=> u==="£" ? "£"+(Math.round(v*100)/100).toFixed(2)
                  : (Math.round(v*1000)/1000)+(u?" "+u:"");

/* ---- step builders, one per question shape ---- */
const BUILD={
  /* a/b of T */
  frac(d){
    const {a,b,T}=d, per=T/b, ans=per*a, S=[];
    S.push({q:`The bottom number is <b>${b}</b>. What does a bottom number always tell you to do?`,
      o:[`Share into ${b} equal groups`,`Multiply by ${b}`,`Add ${b}`,`Take ${b} away`],c:0,
      h:"Think about what a fifth or a quarter means — cutting something into that many equal pieces."});
    S.push({q:`So share ${T} into ${b} groups. What is <b>${T} ÷ ${b}</b>?`,
      o:nOpts(per,[per+1,T-b,per*2,b]).map(String),c:0,
      h:`How many times does ${b} go into ${T}?`});
    if(a===1){
      S.push({q:`The top number is <b>1</b>, so you take just one group. What is the answer?`,
        o:nOpts(ans,[T,per*2,b]).map(String),c:0,h:`One group is what you just worked out.`});
    }else{
      S.push({q:`One group is <b>${per}</b>. The top number is <b>${a}</b>. What do you do now?`,
        o:[`Multiply ${per} by ${a}`,`Divide ${per} by ${a}`,`Add ${a} to ${per}`,`Nothing — you are done`],c:0,
        h:"The top number tells you how many of those groups to take."});
      S.push({q:`What is <b>${per} × ${a}</b>?`,
        o:nOpts(ans,[per,ans+per,T-ans,per*(a+1)]).map(String),c:0,
        h:`Count up in ${per}s, ${a} times.`});
    }
    return S;
  },

  /* p% of T */
  pct(d){
    const {p,T,u}=d, ans=T*p/100, S=[];
    const FR={25:[1,4],50:[1,2],75:[3,4],20:[1,5],10:[1,10]};
    if(FR[p]&&p%10!==0){
      const [nu,de]=FR[p], one=T/de;
      S.push({q:`<b>${p}%</b> is the same as which fraction?`,
        o:[`${nu}/${de}`,`${de}/${nu}`,`${p}/10`,`1/${p}`],c:0,
        h:"Half is 50%. A quarter is 25%. Three quarters is 75%."});
      S.push({q:`So divide by <b>${de}</b>. What is <b>${fmtN(T,u)} ÷ ${de}</b>?`,
        o:nOpts(one,[one*2,T-one,one/2]).map(v=>fmtN(v,u)),c:0,
        h:`Split ${fmtN(T,u)} into ${de} equal parts.`});
      if(nu>1) S.push({q:`Now multiply by <b>${nu}</b>. What is <b>${fmtN(one,u)} × ${nu}</b>?`,
        o:nOpts(ans,[one,T-ans,ans+one]).map(v=>fmtN(v,u)),c:0,
        h:`You need ${nu} of those parts.`});
    }else{
      const row=T/10;
      S.push({q:`Always find <b>10%</b> first. What is <b>${fmtN(T,u)} ÷ 10</b>?`,
        o:nOpts(row,[row*2,T-row,row/2,T]).map(v=>fmtN(v,u)),c:0,
        h:"To divide by 10, every digit moves one place to the right."});
      S.push({q:`10% is <b>${fmtN(row,u)}</b>. How many lots of 10% make <b>${p}%</b>?`,
        o:nOpts(p/10,[p,10,p/5]).map(String),c:0,
        h:`How many tens are there in ${p}?`});
      S.push({q:`So what is <b>${fmtN(row,u)} × ${p/10}</b>?`,
        o:nOpts(ans,[row,T-ans,ans+row,T]).map(v=>fmtN(v,u)),c:0,
        h:`Count up in ${fmtN(row,u)}, ${p/10} times.`});
    }
    return S;
  },

  /* area of a shape */
  area(d){
    const {k,b,h}=d, box=b*h, ans=k==="tri"?box/2:box;
    const S=[{q:`First, what is <b>base × height</b>? ${b} × ${h}`,
      o:nOpts(box,[b+h,box/2,2*(b+h)]).map(String),c:0,h:`${b} lots of ${h}.`}];
    if(k==="tri"){
      S.push({q:`A triangle is exactly <b>half</b> of the rectangle round it. So what do you do to ${box}?`,
        o:["Halve it","Double it","Leave it as it is","Add the base and height"],c:0,
        h:"Picture the rectangle drawn around the triangle — the triangle fills half of it."});
      S.push({q:`What is <b>${box} ÷ 2</b>?`,o:nOpts(ans,[box,box/4,ans+2]).map(v=>v+" cm²"),c:0,
        h:`Half of ${box}.`});
    }else{
      S.push({q:`Do you halve it for a parallelogram?`,
        o:["No — halving is only for triangles","Yes, always","Only if it looks slanted","Yes, then double it"],c:0,
        h:"Cut the end off a parallelogram and slide it round: it becomes a rectangle, not half of one."});
      S.push({q:`So what is the area?`,o:nOpts(ans,[box/2,b+h,2*(b+h)]).map(v=>v+" cm²"),c:0,
        h:"It is the number you worked out in the first step."});
    }
    return S;
  },

  /* unit conversion */
  unit(d){
    const {v,from,to,f,dir}=d, ans=dir==="÷"?v/f:v*f;
    return [
     {q:`How many <b>${from}</b> are there in one <b>${to}</b>?`,
      o:nOpts(f,[f*10,f/10,60]).map(String),c:0,h:"Write the fact down before you do anything else."},
     {q:`You are going from ${from} to ${to}. Is ${to} a <b>bigger</b> or <b>smaller</b> unit?`,
      o:[dir==="÷"?"Bigger, so divide":"Smaller, so multiply",
         dir==="÷"?"Smaller, so multiply":"Bigger, so divide",
         "Same size, so nothing changes","You always multiply"],c:0,
      h:"Going to a bigger unit gives you a smaller number, and that means dividing."},
     {q:`So what is <b>${v} ${dir} ${f}</b>?`,
      o:nOpts(ans,[v,ans*10,ans/10,v*f]).map(String),c:0,
      h:`Move every digit ${String(f).length-1} place${f===10?"":"s"}.`}
    ];
  },

  /* partition an addition or subtraction of decimals */
  dec(d){
    const {x,y,op,u}=d;
    const xi=Math.floor(x), yi=Math.floor(y);
    const xd=Math.round((x-xi)*1000)/1000, yd=Math.round((y-yi)*1000)/1000;
    const wi=op==="+"?xi+yi:xi-yi, wd=Math.round((op==="+"?xd+yd:xd-yd)*1000)/1000;
    const ans=Math.round((op==="+"?x+y:x-y)*1000)/1000;
    return [
     {q:`Split it up. First the <b>whole numbers</b>: ${xi} ${op} ${yi}`,
      o:nOpts(wi,[wi+1,wi-1,xi]).map(String),c:0,h:"Ignore everything after the point for now."},
     {q:`Now the <b>bits after the point</b>: ${xd} ${op} ${yd}`,
      o:nOpts(wd,[wd+0.1,Math.abs(xd-yd),xd]).map(String),c:0,
      h:"Line the points up. Same number of digits on both — add zeros if you need to."},
     {q:`Put them back together: ${wi} + ${wd}`,
      o:nOpts(ans,[ans+0.05,wi,ans-0.1]).map(v=>fmtN(v,u)),c:0,
      h:"Just add the two answers you have already got."}
    ];
  },

  /* scale a recipe or rate up or down */
  scale(d){
    const {per,pu,base,bu,want,ans}=d, f=want/base;
    const up=f>=1;
    return [
     {q:`How does <b>${want} ${bu}</b> compare with <b>${base} ${bu}</b>?`,
      o:up?[...new Set([`${f} times bigger`,`${Math.round(want/base)} times bigger`,
                        `${want-base} times bigger`,`${f*10} times bigger`,`The same`])].slice(0,4)
          :[...new Set([`It is ${f===0.5?"half of it":f+" of it"}`,`It is double`,
                        `It is ${base-want} times smaller`,`The same`])].slice(0,4),c:0,
      h:`Divide ${want} by ${base}.`},
     {q:`So what do you do to the <b>${per} ${pu}</b>?`,
      o:up?[`Multiply it by ${f}`,`Divide it by ${f}`,`Add ${f}`,`Leave it alone`]
          :[`${f===0.5?"Halve it":"Multiply it by "+f}`,`Double it`,`Add ${want}`,`Leave it alone`],c:0,
      h:"Whatever happened to one side happens to the other."},
     {q:`What is <b>${per} ${up?"×":"×"} ${f}</b>?`,
      o:nOpts(ans,[per,want,ans*2,per+want]).map(v=>v+(pu?" "+pu:"")),c:0,
      h:`${f===0.5?"Just halve "+per+".":"Split it up if it helps: "+per+" × "+Math.floor(f)+", then the rest."}`}
    ];
  },

  /* equal parts of a total */
  parts(d){
    const {total,n,take}=d, one=total/n, S=[];
    S.push({q:`To find <b>one part</b>, what do you do to ${total}?`,
      o:[`Divide it by ${n}`,`Multiply it by ${n}`,`Take ${n} away`,`Add ${n}`],c:0,
      h:`There are ${n} equal parts, so share ${total} between them.`});
    S.push({q:`What is <b>${total} ÷ ${n}</b>?`,o:nOpts(one,[one*2,total-n,n]).map(String),c:0,
      h:`How many times does ${n} fit into ${total}?`});
    if(take>1) S.push({q:`One part is <b>${one}</b>. So what are <b>${take} parts</b> worth?`,
      o:nOpts(one*take,[one,total,one*(take+1)]).map(String),c:0,h:`${take} lots of ${one}.`});
    return S;
  },

  /* subtraction by counting on */
  countOn(d){
    const {from,to,u}=d;
    const mid=Math.ceil(from), h1=Math.round((mid-from)*100)/100, h2=Math.round((to-mid)*100)/100;
    const ans=Math.round((to-from)*100)/100;
    return [
     {q:`Instead of taking away, <b>count up</b>. From ${fmtN(from,u)} to ${fmtN(mid,u)} — how far is that?`,
      o:nOpts(h1,[h1*2,1-h1,h1/2]).map(v=>fmtN(v,u)),c:0,h:`What do you add to ${fmtN(from,u)} to make it a round number?`},
     {q:`Now from <b>${fmtN(mid,u)}</b> up to <b>${fmtN(to,u)}</b>?`,
      o:nOpts(h2,[h2*2,h2/2,to]).map(v=>fmtN(v,u)),c:0,h:"This hop is the easy one — the whole part plus what is after the point."},
     {q:`Add your two hops together: ${fmtN(h1,u)} + ${fmtN(h2,u)}`,
      o:nOpts(ans,[ans+0.1,h2,ans-0.1]).map(v=>fmtN(v,u)),c:0,h:"That total is the gap between the two numbers."}
    ];
  },

  /* division leaving a remainder */
  divRem(d){
    const {a,b,big,small}=d, q=Math.floor(a/b), r=a%b;
    return [
     {q:`How many <b>${small}</b> are there in one <b>${big}</b>?`,o:nOpts(b,[b*2,b/2,10]).map(String),c:0,
      h:"Write the fact down first."},
     {q:`What is <b>${a} ÷ ${b}</b>? Give the whole number and what is left over.`,
      o:[`${q} remainder ${r}`,`${q+1} remainder ${r}`,`${q} remainder ${b-r}`,`${q-1} remainder ${r}`],c:0,
      h:`How many whole ${b}s fit into ${a}, and what is left?`},
     {q:`So write that properly.`,
      o:[`${q} ${big} ${r} ${small}`,`${q} ${small} ${r} ${big}`,`${q+r} ${big}`,`${a} ${big}`],c:0,
      h:`The whole number is the ${big}. The leftover is the ${small}.`}
    ];
  },

  /* buying — always round up */
  roundUp(d){
    const {a,b,noun,ans}=d, exact=a/b;
    const whole=Math.floor(exact), rem=a-whole*b;
    const tidy=Math.round(exact*100)/100===exact;
    const first = tidy
      ? {q:`First the division. What is <b>${a} ÷ ${b}</b>?`,
         o:nOpts(exact,[whole,exact*10,exact/10]).map(String),c:0,
         h:`How many whole ${b}s fit into ${a}, and is there a bit left over?`}
      : {q:`First the division. What is <b>${a} ÷ ${b}</b>? Give it with a remainder.`,
         o:[`${whole} remainder ${rem}`,`${whole+1} remainder ${rem}`,`${whole} remainder ${b-rem}`,`${whole} exactly`],c:0,
         h:`How many whole ${b}s fit into ${a}, and what is left over?`};
    return [
     first,
     {q:`Can you buy <b>part of a ${noun}</b>?`,
      o:[`No — you have to buy whole ${noun}s`,`Yes, shops sell halves`,`Only if you ask`,`It does not matter`],c:0,
      h:"Picture it in a shop. There is no half box on the shelf."},
     {q:`${whole} ${noun}s would only give you ${whole*b}, and you need ${a}. So how many must you buy?`,
      o:nOpts(ans,[whole,ans+2,whole*2]).map(String),c:0,
      h:"Go up to the next whole one."}
    ];
  },

  /* hand-written steps for one-off questions */
  raw(d){ return d.steps; },

  /* answered the wrong thing */
  asked(d){
    const {want,wrong,calc,calcWrong,ans,u}=d;
    return [
     {q:`Read it again. Does the question ask for <b>${wrong}</b>, or <b>${want}</b>?`,
      o:[want,wrong,"Both of them","It does not say"],c:0,
      h:"Find the exact words in the question and underline them."},
     {q:`So which calculation gives you <b>${want}</b>?`,
      o:[calc,calcWrong,`${calc} × 2`,"None of these"],c:0,
      h:`You want ${want}, not ${wrong}. That changes which sum you do.`},
     {q:`Work it out: <b>${calc}</b>`,
      o:nOpts(ans,[ans*2,ans+1,ans/2]).map(v=>fmtN(v,u)),c:0,
      h:"Take your time — this is the easy part now you know which sum it is."}
    ];
  }
};

function scaffoldFor(sub,dayN,qIdx){
  const list=SCAFFOLDS[sub+":"+dayN];
  if(!list) return null;
  const d=list[qIdx];
  if(!d) return null;
  const spec = d.k==="area" ? Object.assign({},d,{k:d.k2}) : d;
  try{ const steps=BUILD[d.k](spec); return (steps&&steps.length)?steps:null; }
  catch(e){ return null; }
}

/* Works both inside Claude (window.storage) and on any web host (localStorage) */
const STORE=(()=>{
  const native = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
  return {
    async get(k){
      if(native) return await window.storage.get(k,false);
      const v=localStorage.getItem(k);
      return v==null?null:{key:k,value:v};
    },
    async set(k,v){
      if(native) return await window.storage.set(k,v,false);
      localStorage.setItem(k,v);
      return {key:k,value:v};
    }
  };
})();

async function load(){
  try{
    const r=await STORE.get("drill-data");
    if(r&&r.value) DB=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(r.value));
  }catch(e){}
}

function begin(){
  qi=0;got=0;t0=Date.now(); S.sid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  clearInterval(tick); tick=setInterval(clock,1000);
  render();show("quiz");
}
function clock(){
  const c=el("cl"); if(!c) return;
  const left=DB.mins*60-Math.floor((Date.now()-t0)/1000);
  if(left>=0){ c.textContent=mmss(left); c.className="timer"+(left<=60?" low":""); }
  else { c.textContent="Time's up"; c.className="timer up"; }
}
function render(){
  const q=S.d.qs[qi]; sel=[];answered=false;tries=0;picks=[];qt0=Date.now();hSteps=null;hAt=0;hUsed=false;hEarly=false;
  const numeric=SUBJECTS[S.sub].numeric;
  el("quiz").innerHTML=`<div class="card">
    <div class="bar-row">
      <div class="track"><i style="width:${qi/S.d.qs.length*100}%"></i></div>
      <div class="count">${qi+1}/${S.d.qs.length}</div>
      <div class="timer" id="cl">${mmss(DB.mins*60)}</div>
    </div>
    <p class="ask">${q.a}</p>
    <p class="instr">${q.multi?"Tick <b>two</b> boxes.":"Tick <b>one</b> box."}</p>
    ${q.s?`<div class="stem ${numeric?"m":""}">${q.s}</div>`:""}
    <div class="opts" id="opts">${q.o.map((o,n)=>

      <button class="btn ghost sm" id="stop">Stop</button></div>

  [...el("opts").children].forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  el("primary").onclick=submit;
  el("stop").onclick=()=>{clearInterval(tick);home()};

function pick(n){
  if(answered) return;
  const q=S.d.qs[qi];
  if(q.multi){ const at=sel.indexOf(n); if(at>-1) sel.splice(at,1); else if(sel.length<2) sel.push(n); }
  else sel=[n];
  [...el("opts").children].forEach(b=>{
    const on=sel.includes(+b.dataset.n);
    b.classList.toggle("sel",on);
    b.querySelector(".box").textContent=on?"✓":"";
  });
  el("primary").disabled = q.multi ? sel.length!==2 : sel.length!==1;
}
function submit(){
  const q=S.d.qs[qi];
  if(answered){ qi++; if(qi>=S.d.qs.length) finish(); else render(); return; }
  const want=q.multi?[...q.c].sort().join():String(q.c);
  const have=q.multi?[...sel].sort().join():String(sel[0]);
  const chosen=sel.map(n=>q.o[n]).join(" + ");

  if(want===have){
    answered=true;
    if(tries===0 && !hUsed) got++;
    else logError(q,picks,tries);
    [...el("opts").children].forEach(b=>{b.disabled=true;if(sel.includes(+b.dataset.n))b.classList.add("right")});
    el("msg").innerHTML=`<div class="msg yes"><b>${tries===0?"Correct — first go":"Correct now"}</b>
      <div class="work">${q.w}</div></div>`;
    el("helpSlot").innerHTML="";
    enqueue(questionRow(q, tries===0&&!hUsed, Math.round((Date.now()-qt0)/1000)));
    el("primary").textContent = qi===S.d.qs.length-1?"Finish":"Next question";
    el("primary").disabled=false;
  } else {
    tries++; picks.push(chosen);
    [...el("opts").children].forEach(b=>{if(sel.includes(+b.dataset.n)){b.classList.add("wrong");b.querySelector(".box").textContent="✕"}});
    el("msg").innerHTML=`<div class="msg no"><b>Not that one — have another go</b>${q.h}</div>`;
    if(tries>=2 && scaffoldFor(S.sub,S.d.n,qi)) setTimeout(offerHelp,900);
    setTimeout(()=>{
      sel=[];
      [...el("opts").children].forEach(b=>{b.classList.remove("wrong","sel");b.querySelector(".box").textContent=""});
      el("primary").disabled=true;
    },1500);
  }
}
function logError(q,picks,tries){
  DB.errors.push({
    sid:S.sid, sub:S.sub, day:S.d.n, dayTitle:S.d.t, topic:S.d.wk,
    q:q.a, stem:q.s||"", correct:q.multi?q.c.map(i=>q.o[i]).join(" + "):q.o[q.c],
    picks:picks.slice(), tries:tries, helped:hUsed, helpFirst:hEarly,
    secs:Math.round((Date.now()-qt0)/1000), date:today()
  });
}

  clearInterval(tick);
  const total=S.d.qs.length, secs=Math.round((Date.now()-t0)/1000);
  const b=DB.best[S.sub];
  if(b[S.i]==null||got>b[S.i]) b[S.i]=got;
  DB.sessions.push({sid:S.sid,sub:S.sub,day:S.d.n,dayTitle:S.d.t,score:got,total:total,secs:secs,date:today()});
  await save();
  await enqueue(["Session",today(),SUBJECTS[S.sub].name,S.d.n,strip(S.d.t),
                 got,total,secs,"","","","","",""]);

  let verdict;
  if(got===total) verdict="Every one right first time. Move on tomorrow.";
  else if(got>=total-1) verdict="Nearly clean. Move on tomorrow, and come back to this one at the weekend.";
  else if(got>=total/2) verdict="Halfway. Do this same day again tomorrow before moving on.";
  else verdict="This one needs a second morning. Read the method again together, then repeat this day tomorrow.";

  const over = secs>DB.mins*60;
  const nxt=SUBJECTS[S.sub].days[S.i+1];
  el("done").innerHTML=`<div class="card">
    <h1>Day ${S.d.n} finished</h1>
    <div style="margin:16px 0 4px"><span class="score">${got}/${total}</span><small>right first time</small></div>
    <div><span class="pill">${mmss(secs)} taken</span>${over?`<span class="pill">over the ${DB.mins} minutes</span>`:`<span class="pill">inside the ${DB.mins} minutes</span>`}</div>
    <div class="rule" style="margin-top:16px"><p style="font-size:.95rem">${verdict}</p></div>
    <div class="actions">
      ${nxt?`<button class="btn" id="next">Tomorrow: Day ${nxt.n}</button>`:""}
      <button class="btn ghost" id="again">Redo Day ${S.d.n}</button>
      <button class="btn ghost" id="menu">All days</button></div>
  </div>`;
  if(nxt) el("next").onclick=()=>brief(S.i+1);
  el("again").onclick=()=>brief(S.i);
  el("menu").onclick=home;
  show("done");
}

/* ---------------- Google Sheet sync ----------------
   Every question is queued the moment it is answered, so nothing is lost
   if he stops halfway or closes the tab. The queue survives a refresh.   */
const strip=v=>String(v==null?"":v).replace(/<[^>]+>/g,"").replace(/\n/g," ");

async function enqueue(row){
  DB.queue.push(row);
  await save();
  flushQueue();
}

async function flushQueue(){
  if(!DB.sheetUrl) return {ok:false,why:"no url"};
  if(!DB.queue.length) return {ok:true,sent:0};
  const batch=DB.queue.slice();
  try{
    await fetch(DB.sheetUrl,{
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({key:DB.sheetKey||"",rows:batch})
    });
    DB.queue=DB.queue.slice(batch.length);
    await save();
    return {ok:true,sent:batch.length};
  }catch(e){ return {ok:false,why:"offline"}; }
}

function questionRow(q,rightFirst,secs){
  return ["Question",today(),SUBJECTS[S.sub].name,S.d.n,strip(S.d.t),
          rightFirst?1:0,1,secs,
          strip(q.a)+(q.s?" — "+strip(q.s):""),
          picks.map(strip).join(" | "),
          strip(q.multi?q.c.map(i=>q.o[i]).join(" + "):q.o[q.c]),
          tries, hUsed?"Yes":"No", hEarly?"Yes":"No"];
}

function csv(){
  const q=v=>{ const t=String(v==null?"":v).replace(/<[^>]+>/g,"").replace(/"/g,'""'); return /[",\n]/.test(t)?'"'+t+'"':t; };
  const rows=[["Type","Date","Subject","Day","Section","Score","OutOf","Seconds","Question","HeChose","CorrectAnswer","WrongTries","UsedHelp","HelpBeforeTrying"]];
  DB.sessions.forEach(x=>rows.push(["Session",x.date,SUBJECTS[x.sub].name,x.day,x.dayTitle,x.score,x.total,x.secs,"","","","","",""]));
  DB.errors.forEach(e=>rows.push(["Missed question",e.date,SUBJECTS[e.sub].name,e.day,e.dayTitle,"","",e.secs,
    (e.q+(e.stem?" — "+e.stem.replace(/\n/g," "):"")),e.picks.join(" | "),e.correct,e.tries,e.helped?"Yes":"No",e.helpFirst?"Yes":"No"]));
  return rows.map(r=>r.map(q).join(",")).join("\n");
}

function report(){
  const L=[];
  L.push("MORNING PRACTICE — PROGRESS REPORT");
  L.push("Generated "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}));
  L.push("");
  L.push(`Maths mornings done: ${Object.keys(DB.best.maths).length} of ${MATHS.length}`);
  L.push(`English mornings done: ${Object.keys(DB.best.english).length} of ${ENGLISH.length}`);
  const tot=DB.sessions.reduce((a,x)=>a+x.secs,0);
  L.push(`Total time: ${Math.round(tot/60)} minutes across ${DB.sessions.length} sessions`);
  L.push("");
  L.push("SCORES BY SESSION (first attempts only)");
  DB.sessions.slice().reverse().slice(0,25).forEach(x=>{
    L.push(`  ${x.date}  ${SUBJECTS[x.sub].name} Day ${x.day} — ${x.dayTitle}: ${x.score}/${x.total} in ${mmss(x.secs)}`);
  });
  L.push("");
  L.push("TOPICS NEEDING HELP (most wrong attempts first)");
  const by={};
  DB.errors.forEach(e=>{const k=SUBJECTS[e.sub].name+" - "+e.topic;by[k]=by[k]||{n:0,t:0};by[k].n++;by[k].t+=e.tries;});
  Object.entries(by).sort((a,b)=>b[1].t-a[1].t).forEach(([k,v])=>{
    L.push(`  ${k}: ${v.n} questions missed, ${v.t} wrong attempts`);
  });
  L.push("");
  L.push("QUESTIONS HE GOT WRONG");
  DB.errors.slice().reverse().slice(0,40).forEach(e=>{
    L.push(`  [${SUBJECTS[e.sub].name} Day ${e.day}] ${e.q.replace(/<[^>]+>/g,"")}`);
    if(e.stem) L.push(`      ${e.stem.replace(/<[^>]+>/g,"").replace(/\n/g," ")}`);
    L.push(`      He chose: ${e.picks.map(p=>p.replace(/<[^>]+>/g,"")).join(", ")}`);
    L.push(`      Correct: ${e.correct.replace(/<[^>]+>/g,"")}   (${e.tries} wrong ${e.tries===1?"try":"tries"}, ${e.secs}s${e.helped?(e.helpFirst?", asked for help before attempting it":", needed the step-by-step breakdown"):""})`);
  });
  return L.join("\n");
}
