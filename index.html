/* =======================================================================
   ENGLISH — 16 mornings. Grammar and punctuation.
   ======================================================================= */
const ENGLISH=[
{n:1,wk:"Week 1 · Determiners and subjects",t:"Determiners: find the noun first",
 rule:"A determiner sits directly in front of a noun and tells you <b>which one, whose, or how many</b>: the, a, an, my, your, his, her, our, their, this, that, some, every, both, each, numbers, and names ending in 's.",
 eg:["Whose pencil case is it?\n   → <b>Whose</b>  (which pencil case)","Please take off your shoes.\n   → <b>your</b>  (whose shoes)"],
 qs:[
 {a:"Which word is the determiner?",s:"Harry took an easy exam.",o:["Harry","took","an","easy"],c:2,h:"The noun is <i>exam</i>. Look past the adjective — what is at the front of that group?",w:"<i>An</i>. The determiner comes before any adjectives."},
 {a:"Which word is the determiner?",s:"Ron came last in every race.",o:["came","last","in","every"],c:3,h:"The noun is <i>race</i>. Which word tells you how many races?",w:"<i>Every</i>. <i>In</i> is a preposition — it tells you where, not which."},
 {a:"Which word is the determiner?",s:"We travelled the distance between London and Dover.",o:["travelled","the","between","and"],c:1,h:"The noun is <i>distance</i>. What sits right in front of it?",w:"<i>The</i>. <i>Between</i> is a preposition."},
 {a:"Which word is the determiner?",s:"Rory's golf ball is lime green.",o:["Rory's","golf","is","green"],c:0,h:"Whose ball is it?",w:"<i>Rory's</i>. A name with 's in front of a noun does a determiner's job."},
 {a:"Which word is the determiner?",s:"There was an unusual squeaking sound.",o:["There","was","an","squeaking"],c:2,h:"The noun is <i>sound</i>, described by two words. What starts the group?",w:"<i>An</i> — correct because <i>unusual</i> starts with a vowel sound."},
 {a:"Which row lists ALL the determiners?",s:"Twenty children ran through both doors into the hall.",o:["Twenty, both, the","through, the","Twenty, through, into","both, into, the"],c:0,h:"Three nouns: children, doors, hall. Check the word in front of each.",w:"<i>Twenty</i> children, <i>both</i> doors, <i>the</i> hall. Numbers count as determiners."}]},

{n:2,wk:"Week 1 · Determiners and subjects",t:"a or an, and the whole noun phrase",
 rule:"Use <b>a</b> before a consonant sound and <b>an</b> before a vowel sound. A <b>noun phrase</b> is the noun plus everything describing it — and it starts at the determiner.",
 eg:["an apple crumble · a new jumper · an hour","Zena has a small black cat.\n   longest noun phrase = <b>a small black cat</b>"],
 qs:[
 {a:"a or an?",s:"For dessert we made ______ apple crumble.",o:["a","an"],c:1,h:"Say it out loud. <i>Apple</i> starts with a vowel sound.",w:"<i>An apple crumble.</i>"},
 {a:"a or an?",s:"I hope I get ______ new jumper for Christmas.",o:["a","an"],c:0,h:"<i>New</i> starts with a consonant sound.",w:"<i>A new jumper.</i>"},
 {a:"Tick the sentence that uses determiners correctly.",s:"",o:["We saw a elephant in Uganda.","There was a incredibly loud bang.","Lewis found a famous painting last week.","Captain Red Beard has an gigantic ship."],c:2,h:"Read each one aloud and listen for the vowel sounds.",w:"The others need <i>an elephant</i>, <i>an incredibly loud bang</i>, <i>a gigantic ship</i>."},
 {a:"What is the longest noun phrase?",s:"In our garage, there's a brightly coloured, ultrafast sports car.",o:["sports car","ultrafast sports car","a brightly coloured, ultrafast sports car","In our garage"],c:2,h:"Start at the determiner and take everything that describes the car.",w:"Include the <i>a</i> — that is the part most people leave off."},
 {a:"What is the longest noun phrase?",s:"Kim wants to be a famous professional gymnast one day.",o:["gymnast","famous professional gymnast","a famous professional gymnast","a famous professional gymnast one day"],c:2,h:"<i>One day</i> tells you when — that is an adverbial.",w:"<i>A famous professional gymnast.</i>"},
 {a:"a or an?",s:"Anita found ______ old, rusty key.",o:["a","an"],c:1,h:"The next word is <i>old</i>.",w:"<i>An old, rusty key.</i> Match the sound of the word that follows, not the noun."}]},

{n:3,wk:"Week 1 · Determiners and subjects",t:"The subject: who is doing it?",
 rule:"The <b>subject</b> is who or what is doing the verb. Ask 'who did it?' before you underline anything — and include the determiner.",
 eg:["Lydia found a beautiful necklace.\n   → <b>Lydia</b> did the finding","At 9 o'clock, the postman delivered the letters.\n   → <b>the postman</b>"],
 qs:[
 {a:"What is the subject?",s:"Lydia found a beautiful necklace.",o:["Lydia","found","a beautiful necklace","necklace"],c:0,h:"Who did the finding?",w:"<i>Lydia</i>. The necklace is the object — the thing it happened to."},
 {a:"What is the subject?",s:"At 9 o'clock, the postman delivered the letters.",o:["At 9 o'clock","the postman","delivered","the letters"],c:1,h:"Ignore the part before the comma — that tells you when.",w:"<i>The postman</i>, including <i>the</i>."},
 {a:"What is the subject?",s:"Lucy showed Meera around the school.",o:["Lucy","showed","Meera","the school"],c:0,h:"Who did the showing?",w:"<i>Lucy</i>. <i>Showed</i> is the verb and <i>Meera</i> received the action."},
 {a:"What is the subject?",s:"Last week, I played football in the park.",o:["Last week","I","played","football"],c:1,h:"Who played?",w:"<i>I</i>. Even one letter can be the subject."},
 {a:"What is the subject?",s:"The tired old dog barked at the postman.",o:["The tired old dog","barked","the postman","dog"],c:0,h:"Who barked? Take the whole group of words.",w:"<i>The tired old dog</i> — the full noun phrase, not just <i>dog</i>."},
 {a:"What is the subject?",s:"Under the bridge, three noisy children were shouting.",o:["Under the bridge","three noisy children","were shouting","bridge"],c:1,h:"The opening tells you where. Who was shouting?",w:"<i>Three noisy children.</i>"}]},

{n:4,wk:"Week 1 · Determiners and subjects",t:"Subject, verb, object",
 rule:"<b>Subject</b> does the action. <b>Verb</b> is the action. <b>Object</b> receives it. Say the sentence as three parts before you answer.",
 eg:["Lucy / showed / Meera\n   subject / verb / object","The crowd / cheered / the athletes"],
 qs:[
 {a:"What is the object?",s:"Mrs Patel bought a pastry.",o:["Mrs Patel","bought","a pastry","Patel"],c:2,h:"What was bought?",w:"<i>A pastry</i> — the thing the action landed on."},
 {a:"What is the object?",s:"The crowd cheered the athletes.",o:["The crowd","cheered","the athletes","crowd"],c:2,h:"Who got cheered?",w:"<i>The athletes.</i>"},
 {a:"What is the verb?",s:"Sam kicked the ball over the fence.",o:["Sam","kicked","the ball","the fence"],c:1,h:"Which word is the action?",w:"<i>Kicked.</i>"},
 {a:"What is the subject?",s:"My brother plays for a local football team.",o:["My brother","plays","a local football team","football"],c:0,h:"Who plays?",w:"<i>My brother</i> — determiner included."},
 {a:"What is the object?",s:"Zena had three cats.",o:["Zena","had","three cats","cats"],c:2,h:"What did she have?",w:"<i>Three cats</i>, with the determiner."},
 {a:"Which row splits the sentence correctly?",s:"The gardener planted a tree.",o:["The gardener / planted / a tree","planted / The gardener / a tree","a tree / planted / The gardener","The / gardener planted / a tree"],c:0,h:"Subject first, then verb, then object.",w:"<i>The gardener</i> did it, <i>planted</i> is the action, <i>a tree</i> received it."}]},

{n:5,wk:"Week 1 · Determiners and subjects",t:"Review: determiners and subjects",
 rule:"Mixed questions from the first four mornings. No new rules — just a check that the habits have stuck.",
 eg:["Determiner? Find the noun, look in front.","Subject? Ask who is doing it."],
 qs:[
 {a:"Which word is the determiner?",s:"Please take off your shoes.",o:["Please","take","off","your"],c:3,h:"The noun is <i>shoes</i>.",w:"<i>Your</i>. <i>Off</i> belongs to the verb <i>take off</i>."},
 {a:"What is the subject?",s:"After lunch, my sister tidied her bedroom.",o:["After lunch","my sister","tidied","her bedroom"],c:1,h:"Who did the tidying?",w:"<i>My sister.</i>"},
 {a:"Which row lists all the determiners?",s:"Every child took a packed lunch to the park.",o:["Every, a, the","took, to","Every, took, the","a, to, park"],c:0,h:"Three nouns: child, lunch, park.",w:"<i>Every</i> child, <i>a</i> packed lunch, <i>the</i> park."},
 {a:"What is the object?",s:"The hungry cat chased a small mouse.",o:["The hungry cat","chased","a small mouse","cat"],c:2,h:"What got chased?",w:"<i>A small mouse.</i>"},
 {a:"a or an?",s:"It took ______ hour to get there.",o:["a","an"],c:1,h:"How does <i>hour</i> start when you say it out loud?",w:"<i>An hour</i> — the h is silent, so it starts with a vowel sound."},
 {a:"What is the longest noun phrase?",s:"She bought the last three chocolate cupcakes.",o:["cupcakes","chocolate cupcakes","the last three chocolate cupcakes","three chocolate cupcakes"],c:2,h:"Go all the way back to the determiner.",w:"<i>The last three chocolate cupcakes.</i>"}]},

{n:6,wk:"Week 2 · Verbs",t:"Progressive tense: -ing with a helper",
 rule:"<b>Present progressive</b> = am / is / are + an -ing word (happening now). <b>Past progressive</b> = was / were + an -ing word (was happening then). It always takes two words.",
 eg:["I <b>am eating</b> a biscuit.  (now)","They <b>were playing</b> football.  (then)"],
 qs:[
 {a:"Complete in the present progressive.",s:"I ________ a biscuit.   (to eat)",o:["ate","am eating","have eaten","eat"],c:1,h:"Two words: am/is/are plus -ing.",w:"<i>Am eating</i>. <i>Ate</i> is simple past."},
 {a:"Tick the pair that makes this past progressive.",s:"Julie ________ her bag whilst Felix ________ for the tickets.",o:["had packed / will look","was packing / was looking","is packing / had looked","will pack / is looking"],c:1,h:"Both halves need was/were plus -ing.",w:"<i>Was packing / was looking.</i> Anything with <i>will</i> is future."},
 {a:"Tick the pair that makes this present progressive.",s:"The acrobats ________ carefully whilst the clowns ________ sweets.",o:["will balance / will throw","were balancing / were throwing","had balanced / had thrown","are balancing / are throwing"],c:3,h:"Present means now: am/is/are.",w:"<i>Are balancing / are throwing.</i> <i>Were</i> would make it past."},
 {a:"Complete in the past progressive.",s:"They ________ football when it started to rain.",o:["played","were playing","have played","are playing"],c:1,h:"It was going on when something else happened.",w:"<i>Were playing.</i>"},
 {a:"Which sentence is in the present progressive?",s:"",o:["She walks to school.","She is walking to school.","She walked to school.","She has walked to school."],c:1,h:"Look for is/am/are plus -ing.",w:"<i>She is walking.</i>"},
 {a:"Complete in the present progressive.",s:"Right now I ________ my homework.",o:["do","did","am doing","have done"],c:2,h:"Two words, and it is happening this minute.",w:"<i>Am doing.</i>"}]},

{n:7,wk:"Week 2 · Verbs",t:"Perfect tenses: has, have, had",
 rule:"<b>Present perfect</b> = has / have + past participle. <b>Past perfect</b> = had + past participle, for something that happened <i>before</i> another past event.",
 eg:["I <b>have told</b> him the truth.","She <b>had told</b> her dad before she went.\n   (told first, went after)"],
 qs:[
 {a:"Complete the sentence.",s:"Louise ________ told her dad she was going, so he wasn't surprised when she went.",o:["has","had","have","was"],c:1,h:"The telling came before the going. Two past events need <i>had</i> on the earlier one.",w:"<i>Had told</i> — the past perfect."},
 {a:"Circle the correct present perfect form.",s:"The hen ( has gone / went ) into the barn.",o:["has gone","went"],c:0,h:"Present perfect always has has/have in front.",w:"<i>Has gone.</i>"},
 {a:"Tick the TWO sentences that correctly use the present perfect.",s:"",multi:true,o:["Amy bought some bread.","I have told him the truth.","Kimberly has breaked a window.","A flea has bitten my dog."],c:[1,3],h:"Two things to check: is there a has/have, and is the participle a real word?",w:"<i>Breaked</i> should be <i>broken</i>; <i>Amy bought</i> is simple past. The question said two — give two."},
 {a:"Circle the present perfect form.",s:"Anita ( has seen / saw ) the film.",o:["has seen","saw"],c:0,h:"Which one has a helper verb?",w:"<i>Has seen.</i>"},
 {a:"Circle the present perfect form.",s:"The boys ( were / have been ) on time all week.",o:["were","have been"],c:1,h:"<i>All week</i> means it has carried on up to now.",w:"<i>Have been.</i>"},
 {a:"Complete the sentence.",s:"By the time we arrived, the film ________ started.",o:["has","had","have","was"],c:1,h:"Which happened first — the film starting, or arriving?",w:"<i>Had started</i>, because it happened before they arrived."}]},

{n:8,wk:"Week 2 · Verbs",t:"Irregular past verbs",
 rule:"Most verbs add -ed. A handful change completely, and there is no rule — you have to know them. Say the sentence out loud; the wrong one usually sounds odd.",
 eg:["fly → flew → have flown","catch → caught → have caught"],
 qs:[
 {a:"Change to the past tense.",s:"The Johnsons FLY to Nepal on Saturday.",o:["flyed","flew","flown","flied"],c:1,h:"Yesterday they…?",w:"<i>Flew</i>. <i>Flown</i> only works after has or have."},
 {a:"Complete the sentence.",s:"Kimberly has ________ a window.",o:["breaked","broke","broken","breaks"],c:2,h:"After <i>has</i> you need the participle, not the plain past.",w:"<i>Has broken.</i>"},
 {a:"Complete the sentence.",s:"The hen has ________ into the barn.",o:["went","gone","goed","going"],c:1,h:"You would say 'she went', but after <i>has</i> it changes again.",w:"<i>Has gone.</i>"},
 {a:"Change to the past tense.",s:"I BUY football stickers every week.",o:["buyed","buied","bought","boughted"],c:2,h:"It does not take -ed at all.",w:"<i>Bought.</i>"},
 {a:"Change to the past tense.",s:"I KEEP them in a folder.",o:["keeped","kept","keept","kepped"],c:1,h:"Short and irregular.",w:"<i>Kept.</i>"},
 {a:"Change to the past tense.",s:"He SWIMS at the pool on Fridays.",o:["swimmed","swum","swam","swimed"],c:2,h:"Yesterday he…? <i>Swum</i> needs has or have.",w:"<i>Swam.</i>"}]},

{n:9,wk:"Week 2 · Verbs",t:"Active and passive",
 rule:"<b>Active</b>: the subject does the action. <b>Passive</b>: the subject receives it. The giveaway for passive is <b>was / were</b> plus a past participle, often followed by <b>by</b>.",
 eg:["The boy kicked the ball.  → active","The ball <b>was kicked by</b> the boy.  → passive"],
 qs:[
 {a:"Active or passive?",s:"I can grow fruit and vegetables.",o:["Active","Passive"],c:0,h:"Is the person doing it at the front?",w:"Active — <i>I</i> do the growing and <i>I</i> is the subject."},
 {a:"Active or passive?",s:"We were shown round by the tour guide.",o:["Active","Passive"],c:1,h:"Spot the <i>were … by</i> pattern.",w:"Passive — the guide did it, but <i>we</i> is at the front receiving it."},
 {a:"Active or passive?",s:"The crowd cheered the athletes.",o:["Active","Passive"],c:0,h:"Who is doing the cheering?",w:"Active. The passive would be: the athletes were cheered by the crowd."},
 {a:"Active or passive?",s:"The hospital was opened by the mayor.",o:["Active","Passive"],c:1,h:"was … by.",w:"Passive."},
 {a:"Which is the correct passive version?",s:"The children ignored the alarm.",o:["The children were ignored by the alarm.","The alarm was ignored by the children.","The alarm ignored the children.","The alarm has ignored the children."],c:1,h:"Move the thing being acted on to the front, add was/were, then by.",w:"<i>The alarm was ignored by the children.</i>"},
 {a:"Tick the TWO passive sentences.",s:"",multi:true,o:["Mickey burnt the cakes.","Our decision was made.","The prisoner was captured.","I practise playing the guitar."],c:[1,2],h:"Two of them have <i>was</i> plus a participle and no doer at the front.",w:"Both <i>was made</i> and <i>was captured</i>. The word <i>sentences</i> is plural — your clue to find more than one."}]},

{n:10,wk:"Week 2 · Verbs",t:"Review: all the verb forms",
 rule:"Mixed verbs from this week. If one still catches you out, redo that morning tomorrow instead of moving on.",
 eg:["I eat / I am eating / I ate / I have eaten / I had eaten","Each one changes when it happened."],
 qs:[
 {a:"Which is the present perfect?",s:"",o:["I eat toast.","I am eating toast.","I ate toast.","I have eaten toast."],c:3,h:"has or have plus a participle.",w:"<i>I have eaten toast.</i>"},
 {a:"Complete in the past progressive.",s:"She ________ her book when the phone rang.",o:["read","was reading","has read","reads"],c:1,h:"It was in progress when something interrupted.",w:"<i>Was reading.</i>"},
 {a:"Change to the past tense.",s:"The children RUN to the gate.",o:["runned","ran","run","have run"],c:1,h:"Irregular.",w:"<i>Ran.</i>"},
 {a:"Active or passive?",s:"My sandwich was eaten by the dog.",o:["Active","Passive"],c:1,h:"was … by.",w:"Passive."},
 {a:"Complete the sentence.",s:"By six o'clock, everyone ________ left.",o:["has","had","have","was"],c:1,h:"It happened before six.",w:"<i>Had left.</i>"},
 {a:"Which sentence uses the present progressive?",s:"",o:["He plays chess.","He is playing chess.","He played chess.","He had played chess."],c:1,h:"is + -ing.",w:"<i>He is playing chess.</i>"}]},

{n:11,wk:"Week 3 · Words, clauses and punctuation",t:"Mark the word, not the whole clause",
 rule:"When a question says circle or underline a <b>conjunction</b>, it wants the one joining word — not the part it introduces. Co-ordinating: and, but, or, so. Subordinating: although, because, while, unless, after, if, when.",
 eg:["Patrick is good at cricket <b>and</b> tennis <b>although</b> he doesn't play often.","Circle <b>and</b>. Underline <b>although</b>. Nothing else."],
 qs:[
 {a:"Which word is the co-ordinating conjunction?",s:"Patrick is good at cricket and tennis although he doesn't play very often.",o:["and","although","Patrick","doesn't"],c:0,h:"There are only a few: and, but, or, so, for, nor, yet.",w:"<i>And</i> — one word, not the phrase after it."},
 {a:"Which word is the subordinating conjunction?",s:"Patrick is good at cricket and tennis although he doesn't play very often.",o:["and","although","tennis","play"],c:1,h:"It starts a part that could not stand alone as a sentence.",w:"<i>Although.</i>"},
 {a:"Which word is the conjunction?",s:"We went outside after it had stopped raining.",o:["went","after","had","stopped"],c:1,h:"Which word joins the two halves?",w:"<i>After</i>. <i>Had</i> is a helper verb."},
 {a:"Which is the adverbial phrase?",s:"A new teacher joined our school this term.",o:["A new teacher","joined","our school","this term"],c:3,h:"An adverbial answers when, where, how or why — never who.",w:"<i>This term</i>. <i>A new teacher</i> is the subject."},
 {a:"Which word is the conjunction?",s:"I'm not going to the party unless Naomi comes with me.",o:["going","party","unless","comes"],c:2,h:"Which word sets a condition?",w:"<i>Unless.</i>"},
 {a:"Tick the TWO co-ordinating conjunctions.",s:"The wedding was in a church, and started at two, but the reception was at a hotel.",multi:true,o:["and","was","but","at"],c:[0,2],h:"Two joining words, each linking equal parts.",w:"<i>And</i> and <i>but</i>."}]},

{n:12,wk:"Week 3 · Words, clauses and punctuation",t:"Relative pronouns and relative clauses",
 rule:"A <b>relative pronoun</b> — who, which, that, whose, whom — starts a clause that tells you more about a noun. That whole chunk is a <b>relative clause</b>. Words like her, our and my are not relative pronouns; they just show ownership.",
 eg:["The woman, <b>who</b> was very tall, forgot her screwdriver.","Brighton, <b>which is on the south coast</b>, is lovely.\n   ← relative clause"],
 qs:[
 {a:"Tick the TWO relative pronouns.",s:"The woman, who was very tall, had forgotten her screwdriver, which meant she couldn't hang up our pictures.",multi:true,o:["who","her","which","our"],c:[0,2],h:"Which two start extra information about a noun?",w:"<i>Who</i> and <i>which</i>. <i>Her</i> and <i>our</i> are possessive determiners."},
 {a:"'which is on the south coast' is an example of what?",s:"Brighton, which is on the south coast, is a lovely place.",o:["a conjunction","a main clause","a relative clause","a noun phrase"],c:2,h:"It starts with a relative pronoun and describes Brighton.",w:"A relative clause. A conjunction is a single word, not a whole chunk."},
 {a:"Which words are the relative clause?",s:"Amar met Laura, who is now his best friend, last July.",o:["Amar met Laura","who is now his best friend","last July","his best friend"],c:1,h:"It sits between the commas and starts with a relative pronoun.",w:"<i>Who is now his best friend.</i>"},
 {a:"Is the capitalised part a main clause or a subordinate clause?",s:"Ryan, WHO'S MY COUSIN, loves popcorn.",o:["Main clause","Subordinate clause"],c:1,h:"Could it stand alone as a sentence on its own?",w:"Subordinate — a relative clause is a type of subordinate clause."},
 {a:"Which relative pronoun fits best?",s:"I'm so pleased for the team ________ won the tournament.",o:["whom","when","whose","that"],c:3,h:"You could also use <i>which</i> here — which option means the same?",w:"<i>That</i>. <i>Whose</i> means belonging to; <i>when</i> is about time."},
 {a:"Which word is the relative pronoun?",s:"The cloud, which was dark grey, was directly above Fred.",o:["The","which","was","above"],c:1,h:"Which word introduces the extra information?",w:"<i>Which.</i>"}]},

{n:13,wk:"Week 3 · Words, clauses and punctuation",t:"Speech marks and brackets",
 rule:"Speech marks open <b>and</b> close — every opening one needs its partner. Punctuation for the spoken words goes <i>inside</i>. Brackets and dashes also come in pairs: take the bracketed bit out and the sentence must still work.",
 eg:["The teacher asked his pupils, <b>“</b>Is Marcus ill today?<b>”</b>","Mr Hargreaves <b>(</b>our history teacher<b>)</b> rides a motorbike."],
 qs:[
 {a:"Which version is punctuated correctly?",s:"The teacher asked his pupils Is Marcus ill today",o:["The teacher asked his pupils, Is Marcus ill today?","The teacher asked his pupils, “Is Marcus ill today?”","“The teacher asked his pupils, Is Marcus ill today.”","The teacher asked his pupils “Is Marcus ill today”"],c:1,h:"Comma before the speech starts, question mark inside, closing marks after.",w:"Four things needed: comma, open, question mark, close."},
 {a:"Where do the brackets go?",s:"Mr Hargreaves our history teacher rides a motorbike to school.",o:["Mr Hargreaves (our history teacher rides a motorbike to school).","Mr Hargreaves (our history teacher) rides a motorbike to school.","(Mr Hargreaves our history teacher) rides a motorbike to school.","Mr Hargreaves our history teacher (rides a motorbike to school)."],c:1,h:"Cover the bracketed bit — does what is left still make sense?",w:"<i>Mr Hargreaves rides a motorbike to school</i> still works."},
 {a:"Where do the brackets go?",s:"My dress the red one has got a stain on it.",o:["(My dress the red one) has got a stain on it.","My dress (the red one has got a stain on it).","My dress (the red one) has got a stain on it.","My dress the red one (has got a stain on it)."],c:2,h:"Which bit is the extra detail you could remove?",w:"<i>The red one</i> is the extra information."},
 {a:"Which version is punctuated correctly?",s:"What were you thinking asked the chef You can't make meringue with lavender",o:["“What were you thinking? asked the chef. You can't make meringue with lavender!”","“What were you thinking?” asked the chef. “You can't make meringue with lavender!”","What were you thinking? “asked the chef” You can't make meringue with lavender!","“What were you thinking? asked the chef, You can't make meringue with lavender!”"],c:1,h:"There are two separate bits of speech. Each needs its own pair of marks.",w:"Two pairs — four marks in total."},
 {a:"Which is the correct direct speech version?",s:"The doctor said I should get plenty of rest.",o:["“You should get plenty of rest,” said the doctor.","“You should get plenty of rest” said the doctor.","You should get plenty of rest, “said the doctor.”","“You should get plenty of rest.” Said the doctor."],c:0,h:"A comma goes before the closing speech mark when the sentence carries on.",w:"Comma inside, then <i>said the doctor</i> with a full stop."},
 {a:"Which sentence uses dashes correctly?",s:"",o:["My new — dog — a golden retriever is called Rover.","My new dog — a golden retriever — is called Rover.","My new dog a golden retriever — is called Rover.","My new dog — a golden retriever is called Rover."],c:1,h:"A matched pair around the extra information.",w:"Take out <i>a golden retriever</i> and the sentence still works."}]},

{n:14,wk:"Week 3 · Words, clauses and punctuation",t:"Commas, hyphens, colons, semi-colons",
 rule:"<b>Comma</b>: separates items or fences off extra information. <b>Hyphen</b>: joins two words working as one description. <b>Colon</b>: the second part explains the first. <b>Semi-colon</b>: joins two complete sentences.",
 eg:["a big, red and shiny car · a last-minute holiday","She was late; the bus never came."],
 qs:[
 {a:"Where does the comma go?",s:"Ralph has just bought a big red and shiny car.",o:["after just","after bought","after big","after and"],c:2,h:"Three adjectives in a list: big, red, shiny.",w:"After <i>big</i>. The last two are joined by <i>and</i>, so no comma there."},
 {a:"Where do the two commas go?",s:"My mum who is a great baker owns the cake shop in town.",o:["after mum and after baker","after mum and after shop","after who and after baker","after great and after baker"],c:0,h:"Fence off the extra information about your mum.",w:"After <i>mum</i> and after <i>baker</i> — a pair, like brackets."},
 {a:"Where does the hyphen go?",s:"Swimmers ran out of the water due to a man eating shark.",o:["between due and to","between a and man","between man and eating","between eating and shark"],c:2,h:"Two words working together to describe the shark.",w:"<i>Man-eating</i>. Without it, a man is eating a shark."},
 {a:"Where does the hyphen go?",s:"We booked an incredible last minute holiday to Lanzarote.",o:["between an and incredible","between incredible and last","between last and minute","between minute and holiday"],c:2,h:"Which two words describe the holiday as one idea?",w:"<i>Last-minute.</i>"},
 {a:"Where does the colon go?",s:"The teddy bear was very old it had belonged to Sara's mother.",o:["after teddy","after old","after belonged","after Sara's"],c:1,h:"Where does the explanation start?",w:"After <i>old</i> — the second part explains why."},
 {a:"Where does the semi-colon go?",s:"Marie is in hospital she's having an operation.",o:["after Marie","after hospital","after she's","after having"],c:1,h:"It joins two complete sentences. Where does the first one end?",w:"After <i>hospital</i>."}]},

{n:15,wk:"Week 3 · Words, clauses and punctuation",t:"Word families, prefixes and opposites",
 rule:"A <b>prefix</b> goes on the front, a <b>suffix</b> on the end. A <b>word family</b> shares a root. A <b>synonym</b> means the same; an <b>antonym</b> means the opposite.",
 eg:["cheer → cheerful (adjective) → cheerfully (adverb)","possible → impossible · helpful → unhelpful · sane → insane"],
 qs:[
 {a:"Which is an adjective made by adding a suffix to 'cheer'?",s:"",o:["cheerfully","cheers","cheerful","cheerer"],c:2,h:"An adjective describes: a ______ face.",w:"<i>Cheerful</i>. <i>Cheerer</i> is not a word."},
 {a:"Which prefix makes the opposite of 'possible'?",s:"",o:["un–","in–","im–","dis–"],c:2,h:"Say each aloud — which sounds like a real word?",w:"<i>Impossible</i>. <i>Im–</i> is used before m and p."},
 {a:"Tick the words that are antonyms for 'open'.",s:"",o:["easy, simple","shut, blocked","clear, accessible","imprisoned, captive"],c:1,h:"Antonym means opposite.",w:"<i>Shut, blocked</i>. <i>Clear</i> and <i>accessible</i> are synonyms of open."},
 {a:"Which word belongs to the family of literature, illiterate, alliteration?",s:"",o:["literate","litter","liberate","litre"],c:0,h:"They share the root <i>liter</i>, to do with letters.",w:"<i>Literate</i> — able to read."},
 {a:"Complete with an adjective formed from 'critic'.",s:"Mr Barnes is a ________ teacher who's always telling us off.",o:["criticise","critical","critically","criticism"],c:1,h:"You need a word that describes the teacher.",w:"<i>Critical.</i>"},
 {a:"What does the root 'cent' mean in century, percentage, centipede?",s:"",o:["smell","hundred","part","insect"],c:1,h:"How many years in a century?",w:"<i>Hundred.</i>"}]},

{n:16,wk:"Week 4 · Test yourself",t:"Mixed test: everything so far",
 rule:"No reminders this time — do this one as if it were the real paper. Read each instruction twice and count your answers before pressing Check.",
 eg:["Does it say one, two, all or each?","Have I marked only what was asked for?"],
 qs:[
 {a:"Which option makes this subjunctive?",s:"It is essential that he ________ the plant each day.",o:["waters","water","watering","watered"],c:1,h:"After <i>it is essential that</i>, the verb drops its -s.",w:"<i>Water.</i> It sounds wrong at first — that is how you spot the subjunctive."},
 {a:"Which option makes this subjunctive?",s:"If I ________ a bit taller, I could reach the top shelf.",o:["was","could be","were","would be"],c:2,h:"In an imaginary <i>if</i> sentence it is always <i>were</i>.",w:"<i>Were</i> — like 'If I were you'."},
 {a:"Tick the TWO grammatically correct sentences.",s:"",multi:true,o:["Remember to buy a ticket before you got on the train.","I bought a hat, but I didn't bought a dress.","We cooked curry for tea, and we baked a cake for dessert.","They will tell us a story, and we will listen carefully."],c:[2,3],h:"Sentence 1: <i>got</i> or <i>get</i>? Sentence 2: after <i>didn't</i>, is it <i>bought</i> or <i>buy</i>?",w:"3 and 4. Trust your first choice — do not rub out a right answer."},
 {a:"Which pair are the adverbs?",s:"1. Sasha will probably teach you to paint.\n2. The biscuits will run out soon.",o:["probably only","probably and soon","will and soon","teach and run"],c:1,h:"'In each sentence' means every sentence has one.",w:"<i>Probably</i> and <i>soon</i>. Count your answers against the instruction."},
 {a:"Which word is the determiner?",s:"Please take off your shoes.",o:["Please","take","off","your"],c:3,h:"Find the noun, then look in front of it.",w:"<i>Your.</i>"},
 {a:"What is the subject?",s:"At 9 o'clock, the postman delivered the letters.",o:["At 9 o'clock","the postman","delivered","the letters"],c:1,h:"Who did the delivering?",w:"<i>The postman.</i>"},
 {a:"Active or passive?",s:"We were shown round by the tour guide.",o:["Active","Passive"],c:1,h:"were … by.",w:"Passive."},
 {a:"Tick the TWO present perfect sentences.",s:"",multi:true,o:["Amy bought some bread.","I have told him the truth.","Kimberly has breaked a window.","A flea has bitten my dog."],c:[1,3],h:"has/have plus a real participle.",w:"<i>Have told</i> and <i>has bitten</i>."}]}
];



/* =======================================================================
   METHODS — the different routes to the same answer.
   Method 1 is always the one I'd teach first.
   ======================================================================= */
const METHODS={
"maths:1":[
 {n:"Divide, then multiply",when:"The default. Works for every fraction.",
  rule:"Divide by the <b>bottom</b> number. Multiply by the <b>top</b> number.",
  eg:["3/5 of 45\n   45 ÷ 5 = 9\n    9 × 3 = <b>27</b>"]},
 {n:"Keep halving",when:"Quickest for halves, quarters and eighths.",
  rule:"For a quarter, halve it <b>twice</b>. For an eighth, halve it <b>three times</b>. Then multiply by the top number.",
  eg:["3/4 of 28\n   half of 28 = 14\n   half of 14 = 7   (that is 1/4)\n        7 × 3 = <b>21</b>"]},
 {n:"Draw a bar",when:"When the numbers confuse him. Slower but it never lies.",
  rule:"Draw a bar, chop it into as many chunks as the <b>bottom</b> number. Write the size of one chunk. Shade the <b>top</b> number of chunks.",
  eg:["2/5 of 30\n   [6][6][6][6][6]  ← five chunks of 6\n   shade two → <b>12</b>"]}],

"maths:2":[
 {n:"Turn it into a fraction",when:"Best for 10, 20, 25, 50 and 75% — which is most SATs questions.",
  rule:"Swap the percentage for its fraction, then it is exactly the same as Day 1.<br>50% = 1/2 · 25% = 1/4 · 75% = 3/4 · 20% = 1/5 · 10% = 1/10",
  eg:["75% of £280\n   75% is 3/4\n   280 ÷ 4 = 70\n    70 × 3 = <b>£210</b>"]},
 {n:"The 10% ladder",when:"For the awkward ones — 30%, 60%, 80%, 5%, 15%.",
  rule:"Find <b>10%</b> by dividing by 10. Then build: double it for 20%, halve it for 5%, halve the whole thing for 50%.",
  eg:["80% of 300 ml\n   10% = 30\n   80% = 30 × 8 = <b>240 ml</b>","75% of £280\n   10% = £28 → 50% = £140, 25% = £70\n   140 + 70 = <b>£210</b>"]},
 {n:"The 1% unit",when:"The fallback for odd numbers like 37%. Hardest arithmetic — use last.",
  rule:"Divide by <b>100</b> to find 1%. Then multiply by however many percent you need.",
  eg:["75% of £280\n   280 ÷ 100 = £2.80   (1%)\n   2.80 × 75 = <b>£210</b>"]}],

"maths:3":[
 {n:"Simplify to one you know",when:"Fastest when the fraction cancels down neatly.",
  rule:"Write it as a fraction, cancel it down, then use the ones you know by heart.",
  eg:["12 out of 60\n   12/60 = 1/5\n   1/5 = <b>20%</b>"]},
 {n:"Scale the bottom to 100",when:"When the bottom number divides into 100 — 50, 25, 20, 10, 4, 5.",
  rule:"Multiply the bottom up to <b>100</b>, and do the same to the top. Per cent means out of a hundred, so the top is your answer.",
  eg:["30 out of 50\n   × 2 top and bottom\n   60/100 = <b>60%</b>"]},
 {n:"Divide and times by 100",when:"Always works, even with ugly numbers.",
  rule:"Divide the part by the whole, then multiply by 100.",
  eg:["12 out of 60\n   12 ÷ 60 = 0.2\n   0.2 × 100 = <b>20%</b>"]}],

"maths:4":[
 {n:"Each share, then take away",when:"The safest. Do one thing at a time.",
  rule:"Work out each person's share <b>separately</b>. Then take them all off the total.",
  eg:["30 bottles, Felix 2/5, Anita 3/10\n   Felix 12, Anita 9\n   30 − 12 − 9 = <b>9 left</b>"]},
 {n:"Add the fractions first",when:"Fewer steps, if he is confident with denominators.",
  rule:"Add the fractions taken, take that from <b>1 whole</b>, then find that fraction of the amount.",
  eg:["2/5 + 3/10 = 4/10 + 3/10 = 7/10\n   left = 3/10\n   3/10 of 30 = <b>9</b>"]},
 {n:"Draw the bar",when:"When two fractions in one question tangle him up.",
  rule:"One bar for the whole amount, chopped into tenths. Shade Felix's, shade Anita's, count what is bare.",
  eg:["30 bottles as ten chunks of 3\n   Felix 4 chunks, Anita 3 chunks\n   3 chunks bare = <b>9</b>"]}],

"maths:5":[
 {n:"Find one part first",when:"The default for any ratio or sharing question.",
  rule:"Divide by the number of parts to get <b>one part</b>. Then multiply up to however many you need.",
  eg:["4 parts make 24\n   24 ÷ 4 = 6\n   5 parts = 6 × 5 = <b>30</b>"]},
 {n:"How many times bigger?",when:"Best for recipes and scaling a whole list at once.",
  rule:"Work out the <b>scale factor</b> — how many times bigger the new amount is — then multiply everything by it.",
  eg:["60 g per 100 ml → 350 ml\n   350 ÷ 100 = 3.5 times\n   60 × 3.5 = <b>210 g</b>"]},
 {n:"Double and halve",when:"When the scale factor is 2, 2.5, 5 or a half — no long multiplication needed.",
  rule:"Build it from doubling and halving instead of multiplying.",
  eg:["8 km = 5 miles, so 4 km = ?\n   4 is half of 8\n   half of 5 = <b>2.5 miles</b>"]}],

"maths:6":[
 {n:"Pad with zeros",when:"The default. Makes every number the same length.",
  rule:"Add zeros on the end until every number has the same digits after the point. Then read <b>left to right</b>.",
  eg:["1.06 and 1.306\n   1.060\n   1.306\n   → <b>1.306 is bigger</b>"]},
 {n:"Column by column",when:"Good when there are lots of numbers to put in order.",
  rule:"Compare the <b>units</b> first. If they tie, compare the <b>tenths</b>. Then hundredths. Stop as soon as one wins.",
  eg:["2.05  2.5  2.15  2.1\n   units all 2 → tenths: 0, 5, 1, 1\n   0 is smallest → <b>2.05</b>"]},
 {n:"Put them in the same unit",when:"For money and measures mixed together.",
  rule:"Change them all into <b>pence</b>, or all into <b>pounds</b>, before comparing anything.",
  eg:["48p · £0.84 · 408p · £4.80\n   48 · 84 · 408 · 480 pence\n   → <b>48p is smallest</b>"]}],

"maths:7":[
 {n:"Column, points lined up",when:"The default, and what the mark scheme expects to see.",
  rule:"Write them one under the other with the <b>points in a straight line</b>. Fill gaps with zeros.",
  eg:["  13.70\n+  8.92\n -------\n  <b>22.62</b>"]},
 {n:"Work in whole numbers",when:"For money. Removes the decimal point entirely.",
  rule:"Turn everything into <b>pence</b> (or millimetres), do it as whole numbers, then convert back at the end.",
  eg:["£13.70 + £8.92\n   1370 + 892 = 2262 pence\n   → <b>£22.62</b>"]},
 {n:"Count on",when:"For subtractions with a near-round number, like £10.35 − £9.60.",
  rule:"Start at the smaller number and <b>count up</b> to the bigger one. Add the hops.",
  eg:["£9.60 → £10.00 is 40p\n   £10.00 → £10.35 is 35p\n   40 + 35 = <b>75p</b>"]}],

"maths:8":[
 {n:"Look at the next digit",when:"The default rule for every rounding question.",
  rule:"Find the place you are rounding to, then look at the <b>very next digit</b>. 5 or more rounds up, 4 or less stays put.",
  eg:["0.126 to 1 d.p.\n   next digit is 2 → down\n   → <b>0.1</b>"]},
 {n:"Which is it nearer?",when:"When the rule feels arbitrary — this shows why it works.",
  rule:"Write the two numbers it sits between. Ask which one it is <b>closer to</b>.",
  eg:["736 to the nearest 10\n   730 ←― 736 ―→ 740\n   6 away vs 4 away → <b>740</b>"]},
 {n:"Buying always rounds UP",when:"Boxes, packs, coaches, tins. Not really rounding — a different rule.",
  rule:"If the question is about <b>buying enough</b>, always round up, even from .1. Part of a box is no use.",
  eg:["4500 ÷ 200 = 22.5 boxes\n   22 is not enough\n   → <b>23 boxes</b>"]}],

"maths:9":[
 {n:"Ignore the point, put it back",when:"The default for multiplying decimals.",
  rule:"Take the point out, multiply as whole numbers, then put the point back in the same place.",
  eg:["£2.70 × 8\n   270 × 8 = 2160\n   → <b>£21.60</b>"]},
 {n:"Split it up",when:"When he can do it in his head in two easy pieces.",
  rule:"Break the number into its whole part and its decimal part, multiply each, then add.",
  eg:["2.70 × 8\n   2 × 8 = 16\n   0.70 × 8 = 5.60\n   16 + 5.60 = <b>£21.60</b>"]},
 {n:"Check it backwards",when:"Not a way of getting the answer — a way of catching a wrong one.",
  rule:"After any division, <b>multiply your answer back</b>. If you do not land on the number you started with, it is wrong.",
  eg:["74.83 ÷ 7 = 10.69?\n   10.69 × 7 = 74.83 ✓\n   10.59 × 7 = 74.13 ✗"]}],

"maths:10":[
 {n:"Mixed review",when:"No new methods today.",
  rule:"Everything from the first two weeks, jumbled up. Use whichever method he settled on for each type — the point today is <b>spotting which kind of question it is</b>, not learning anything new.",
  eg:["Fraction of an amount → ÷ bottom, × top","Percentage → fraction, or the 10% ladder","Decimals → line up the point"]}],

"maths:11":[
 {n:"Move the digits",when:"The default once he trusts it.",
  rule:"Bigger unit → <b>divide</b>. Smaller unit → <b>multiply</b>. By 10, 100 or 1000 depending on the pair.",
  eg:["15 cm into metres\n   100 cm = 1 m, so ÷ 100\n   → <b>0.15 m</b>"]},
 {n:"Learn the four facts",when:"When he cannot remember which way round to go.",
  rule:"Only four facts to know:<br>10 mm = 1 cm · 100 cm = 1 m · 1000 m = 1 km · 1000 g = 1 kg · 1000 ml = 1 litre.<br>Write the fact down first, then decide.",
  eg:["193 oz, and 16 oz = 1 lb\n   193 ÷ 16 = 12 r 1\n   → <b>12 lb 1 oz</b>"]},
 {n:"Does it sound daft?",when:"A check, not a method. Catches the biggest mistakes.",
  rule:"Look at the answer and ask if it could be real. A number in the wrong unit is usually <b>ridiculous</b>.",
  eg:["A plant grew 15 m?\n   That is taller than a house.\n   → must be <b>0.15 m</b>"]}],

"maths:12":[
 {n:"What is one gap worth?",when:"The default for any scale, dial or number line.",
  rule:"Find two <b>labelled</b> numbers. Count the gaps between them. Divide the difference by the number of gaps.",
  eg:["2 to 2.25, five gaps\n   0.25 ÷ 5 = <b>0.05 each</b>"]},
 {n:"Count on from a label",when:"When the arrow is near a labelled number.",
  rule:"Start at the nearest labelled number and <b>hop</b> along, adding one gap at a time.",
  eg:["from 2: 2.05, 2.10, <b>2.15</b>"]},
 {n:"Take off the start",when:"For measuring something that does not begin at zero.",
  rule:"Read where it <b>ends</b>, read where it <b>starts</b>, and subtract. Never just read the end.",
  eg:["kitten runs 8 cm → 36 cm\n   36 − 8 = <b>28 cm</b>"]}],

"maths:13":[
 {n:"Learn the three formulas",when:"The default. Three lines to memorise.",
  rule:"Rectangle: base × height.<br>Triangle: base × height <b>÷ 2</b>.<br>Parallelogram: base × <b>perpendicular</b> height, no halving.",
  eg:["triangle, base 8, height 10\n   8 × 10 = 80\n   80 ÷ 2 = <b>40 cm²</b>"]},
 {n:"Draw the rectangle round it",when:"When he cannot remember whether to halve.",
  rule:"Box the triangle in with a rectangle. Work out the rectangle. The triangle is always <b>half</b> of it.",
  eg:["triangle in an 8 × 10 box\n   box = 80\n   half of 80 = <b>40 cm²</b>"]},
 {n:"Cut and slide",when:"For parallelograms. Kills the slanted-side mistake for good.",
  rule:"Cut the triangle off one end and slide it round to the other. It becomes a <b>rectangle</b> — and now the height is obvious.",
  eg:["parallelogram base 5, height 2\n   becomes a 5 × 2 rectangle\n   → <b>10 cm²</b>"]}],

"maths:14":[
 {n:"Split into rectangles",when:"The default for any L-shape.",
  rule:"Chop the shape into rectangles, work out each one, and <b>add</b> them together.",
  eg:["(7 × 4) + (2 × 1)\n   28 + 2 = <b>30 m²</b>"]},
 {n:"Whole box, take the bite out",when:"When the missing piece is easier to see than the pieces left.",
  rule:"Work out the <b>whole</b> rectangle as if the shape were complete, then subtract the missing corner.",
  eg:["big box 8 × 4 = 32\n   missing corner 1 × 2 = 2\n   32 − 2 = <b>30 m²</b>"]},
 {n:"Count the squares",when:"On squared paper. Slow but he will not get it wrong.",
  rule:"Count whole squares. Put two halves together to make a whole. Works for any shape at all.",
  eg:["30 squares, each 1 m²\n   → <b>30 m²</b>"]}],

"maths:15":[
 {n:"Mixed review",when:"No new methods today.",
  rule:"Everything from this week together. The skill today is <b>choosing</b> which method the question needs — that is what the real paper tests.",
  eg:["Unit change → the number must change too","Triangle → halve it. Parallelogram → do not.","Scale → work out one gap first"]}],

"maths:16":[
 {n:"Put the number in and work in order",when:"The default for substitution.",
  rule:"Replace every letter with the number. Do the <b>squaring</b> first, then the <b>multiplying</b>, then the <b>adding</b>.",
  eg:["n² + 3n, when n = 6\n   36 + 18 = <b>54</b>"]},
 {n:"Say it out loud first",when:"For turning words into algebra — where he goes wrong.",
  rule:"Say the sentence in plain words, then swap each bit for symbols. <b>Twice</b> means × 2. <b>More than</b> means +.",
  eg:["three more than twice n\n   two lots of n, then add three\n   → <b>2n + 3</b>"]},
 {n:"Try a number on it",when:"To check an expression is the right one.",
  rule:"Pick an easy number like 10. Work out the answer in your head, then test each option.",
  eg:["n = 10 → twice, add 3 = 23\n   2n + 3 gives 23 ✓\n   n + 3 gives 13 ✗"]}],

"maths:17":[
 {n:"Find the step / undo in reverse",when:"The default for sequences and think-of-a-number.",
  rule:"For a sequence, subtract one term from the next to find the <b>step</b>. To work backwards, do the <b>opposite</b> operation, starting from the end.",
  eg:["427, 537 → step is +110\n   647 + 110 = <b>757</b>","? + 25, ÷ 2, − 17 = 6\n   6 + 17 = 23, × 2 = 46, − 25 = <b>21</b>"]},
 {n:"Test the options forwards",when:"In a multiple-choice question. Often faster than working backwards.",
  rule:"Take each answer offered and run it <b>forwards</b> through the steps. Keep the one that lands on the right number.",
  eg:["try 21: +25 = 46, ÷2 = 23, −17 = 6 ✓"]},
 {n:"Times and divide come first",when:"Any calculation with mixed signs. This is a rule, not a choice.",
  rule:"Brackets first, then <b>× and ÷</b>, then <b>+ and −</b>. Left to right is wrong and will cost the mark.",
  eg:["88 − 20 × 4\n   20 × 4 = 80\n   88 − 80 = <b>8</b>"]}],

"maths:18":[
 {n:"Underline what it asks for",when:"The default, and worth about 8 marks a paper.",
  rule:"Before working anything out, underline the words that say <b>what to find</b>: change, left, each, total, difference, how many boxes.",
  eg:["spent £18.75, paid £20\n   underline <b>change</b>\n   20 − 18.75 = <b>£1.25</b>"]},
 {n:"Write the label with the answer",when:"Stops him answering in the wrong unit.",
  rule:"Never write a bare number. Write <b>what it is</b> next to it — boxes, km, change, mean. If the label does not match the question, it is wrong.",
  eg:["4000 <b>metres</b> — but it asked for km\n   → <b>4 km</b>"]},
 {n:"Could that be true?",when:"A last check before moving on.",
  rule:"Look at the answer and ask if it is <b>sensible</b>. Half a box, change bigger than the note, a mean bigger than the total — all impossible.",
  eg:["22.5 boxes — you cannot buy half\n   → <b>23</b>"]}],

"maths:19":[
 {n:"Fast pass, then come back",when:"The default way to sit a timed paper.",
  rule:"Go through once answering everything easy. <b>Skip</b> anything that stalls you and put a dot beside it. Come back with the time left.",
  eg:["26 marks were lost to blank boxes\nnearly all in the last three questions"]},
 {n:"Estimate, then commit",when:"When he genuinely does not know how to do it.",
  rule:"Round the numbers and do it roughly. Write that down. A close answer sometimes scores, and an empty box <b>never</b> does.",
  eg:["4500 ÷ 200\n   about 45 ÷ 2 = about 20\n   → write <b>23</b>"]},
 {n:"Show the working anyway",when:"On any question worth 2 marks.",
  rule:"Write the calculation even if the final answer is wrong. Method marks are given for the <b>working</b>, not just the answer.",
  eg:["£8.16 ÷ 6 =\n   even a wrong total can earn 1 of 2"]}],

"maths:20":[
 {n:"The real thing",when:"No method card today, on purpose.",
  rule:"Sit this like the actual paper. Read each question twice, underline what it asks for, and <b>put something in every box</b>.",
  eg:["No reminders. That is the test."]}]
};

const COLS=["#FF6B6B","#FFA94D","#FFD43B","#51CF66","#4DABF7","#9775FA","#F783AC","#38D9A9","#A9E34B","#FF922B"];
const NUM=["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const DEN={2:["half","halves"],3:["third","thirds"],4:["quarter","quarters"],5:["fifth","fifths"],
           6:["sixth","sixths"],8:["eighth","eighths"],10:["tenth","tenths"]};
const fracWords=(a,b)=>{const d=DEN[b]||[b+"th",b+"ths"];return NUM[a]+" "+(a===1?d[0]:d[1])};
const money=(v,u)=> u==="£" ? "£"+(Math.round(v*100)/100).toFixed(2) : (Math.round(v*100)/100)+(u?" "+u:"");
const sayMoney=(v,u)=> u==="£" ? (v>=1? (Math.round(v*100)/100).toFixed(2)+" pounds" : Math.round(v*100)+" pence")
                                : (Math.round(v*100)/100)+(u?" "+u:"");

/* --------------------------- speech --------------------------------- */
let VOICE=null, SOUND=true, sTimer=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const v=speechSynthesis.getVoices();
  VOICE = v.find(x=>x.lang==="en-GB"&&/sonia|libby|kate|serena|daniel|george/i.test(x.name))
       || v.find(x=>x.lang==="en-GB") || v.find(x=>x.lang&&x.lang.startsWith("en")) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,after){
  if(!("speechSynthesis" in window)||!SOUND){ if(after) sTimer=setTimeout(after,3400); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(VOICE) u.voice=VOICE;
  u.rate=.9; u.pitch=1.05; u.lang="en-GB";
  u.onend=()=>{ if(after) sTimer=setTimeout(after,750); };
  u.onerror=()=>{ if(after) sTimer=setTimeout(after,2600); };
  speechSynthesis.speak(u);
}
function hush(){ clearTimeout(sTimer); if("speechSynthesis" in window) speechSynthesis.cancel(); }
let sPrimed=false;
function primeSpeech(){
  if(sPrimed||!("speechSynthesis" in window)) return;
  sPrimed=true;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener("touchstart",primeSpeech,{once:true,passive:true});
document.addEventListener("click",primeSpeech,{once:true});

/* ============ 1. FRACTIONS OF AN AMOUNT (maths day 1) ================ */
const FRACTIONS={
  title:"Fractions of an amount",
  presets:[[3,5,45],[2,3,24],[3,4,28],[1,4,20],[2,5,30],[3,10,30]],
  label:p=>`${p[0]}/${p[1]} of ${p[2]}`,
  head:p=>`<div class="sum">
      <span class="frac"><span class="top" id="xTop">${p[0]}</span><span class="bot" id="xBot">${p[1]}</span></span>
      <span class="of">of</span><span class="tot">${p[2]}</span>
      <span class="eq hide" id="xEq">= ${p[2]/p[1]*p[0]}</span></div>`,
  build(stage,p){
    const [a,b,T]=p, per=T/b;
    const W=stage.clientWidth||330;
    const gc=Math.ceil(Math.sqrt(per)), gr=Math.ceil(per/gc);
    const rows=b<=5?1:2, perRow=Math.ceil(b/rows), gap=8, pad=6, labH=18;
    const gw=Math.floor((W-gap*(perRow-1))/perRow);
    const cell=Math.max(9,Math.min(26,Math.floor((gw-pad*2)/gc)));
    const bw=gc*cell+pad*2, bh=gr*cell+pad*2+labH;
    const rowW=perRow*bw+gap*(perRow-1), offX=Math.max(0,(W-rowW)/2);
    const gpos=[], slots=[];
    for(let g=0;g<b;g++){
      const r=Math.floor(g/perRow), c=g%perRow;
      const bx=offX+c*(bw+gap), by=r*(bh+gap);
      gpos.push({x:bx,y:by});
      for(let k=0;k<per;k++) slots.push({x:bx+pad+(k%gc)*cell, y:by+pad+Math.floor(k/gc)*cell});
    }
    const totH=Math.ceil(b/perRow)*bh+(Math.ceil(b/perRow)-1)*gap;
    const pc=Math.min(T,Math.ceil(Math.sqrt(T*1.7))), pr=Math.ceil(T/pc);
    const px=Math.max(0,(W-pc*cell)/2), py=Math.max(0,(totH-pr*cell)/2);
    const pile=[];
    for(let i=0;i<T;i++) pile.push({x:px+(i%pc)*cell, y:py+Math.floor(i/pc)*cell});

    stage.style.height=totH+"px";
    stage.innerHTML="";
    gpos.forEach((q,g)=>{
      const d=document.createElement("div"); d.className="grp";
      d.style.cssText=`left:${q.x}px;top:${q.y}px;width:${bw}px;height:${bh}px;border-color:${COLS[g%COLS.length]}`;
      d.innerHTML=`<span class="glab">${per}</span><span class="tick">✓</span>`;
      stage.appendChild(d);
    });
    for(let i=0;i<T;i++){
      const e=document.createElement("div"); e.className="dot";
      e.style.cssText=`width:${cell-5}px;height:${cell-5}px;transition-delay:${(i%18)*14}ms`;
      e.style.transform=`translate(${pile[i].x}px,${pile[i].y}px)`;
      stage.appendChild(e);
    }
    stage._pile=pile; stage._slots=slots;
  },
  steps(p){
    const [a,b,T]=p, per=T/b, ans=per*a, fw=fracWords(a,b), one=DEN[b]?DEN[b][0]:"part";
    const count=[]; for(let i=1;i<=a;i++) count.push(per*i);
    return [
     {cap:`We want <b>${fw}</b> of <b>${T}</b>. Here are all ${T} counters.`,
      say:`We want to find ${fw} of ${T}. Here are all ${T} counters.`},
     {cap:`The <span class="sky"><b>bottom</b></span> number is <span class="sky"><b>${b}</b></span>. Share them into <span class="sky"><b>${b} equal groups</b></span>.`,
      say:`The bottom number is ${b}. That tells us to share them into ${b} equal groups. Watch.`},
     {cap:`Count one group: <b>${per}</b>. So one ${one} of ${T} is <b>${per}</b>.`,
      say:`Now count one group. ${per}. So one ${one} of ${T} is ${per}.`},
     {cap:`The <span class="hot"><b>top</b></span> number is <span class="hot"><b>${a}</b></span>. So <b>take ${a}</b> of those groups.`,
      say:`The top number is ${a}. So we take ${a} of those groups, and leave the rest.`},
     {cap:`${a} groups of ${per}. That makes <b>${ans}</b>.`,
      say:`${a} groups of ${per}. ${count.join(", ")}. That makes ${ans}.`},
     {cap:`So <b>${fw} of ${T} is ${ans}</b>. Divide by the bottom, multiply by the top. Every time.`,
      say:`So ${fw} of ${T} is ${ans}. ${T} divided by ${b} is ${per}. ${per} times ${a} is ${ans}. Divide by the bottom, multiply by the top. It works every single time.`}
    ];
  },
  apply(stage,p,phase){
    const [a,b,T]=p, per=T/b;
    const grps=[...stage.querySelectorAll(".grp")], dots=[...stage.querySelectorAll(".dot")];
    const top=el("xTop"), bot=el("xBot"), eq=el("xEq");
    if(top) top.className="top"+(phase>=3?" lit":"");
    if(bot) bot.className="bot"+(phase>=1&&phase<3?" lit":"");
    if(eq) eq.classList.toggle("hide",phase<4);
    dots.forEach((d,i)=>{
      const to = phase===0?stage._pile[i]:stage._slots[i];
      d.style.transform=`translate(${to.x}px,${to.y}px)`;
      const g=Math.floor(i/per);
      d.style.background = phase===0?"#4DABF7":COLS[g%COLS.length];
      d.classList.toggle("dim", phase>=3 && g>=a);
    });
    grps.forEach((g,i)=>{
      g.classList.toggle("on",phase>=1);
      g.querySelector(".glab").classList.toggle("on",phase>=2);
      g.classList.toggle("take",phase>=3&&i<a);
      g.classList.toggle("drop",phase>=3&&i>=a);
      g.querySelector(".tick").classList.toggle("on",phase>=3&&i<a);
    });
  },
  extra(p,phase){
    if(phase<5) return "";
    const [a,b,T]=p, per=T/b;
    return `<div class="line draw"><span class="skyt">${T} ÷ ${b}</span> = ${per}</div>
            <div class="line l2 draw"><span class="hott">${per} × ${a}</span> = <span class="grn">${per*a}</span></div>`;
  },
  quiz(p,all){
    const n=all[(all.findIndex(x=>x.join()===p.join())+1)%all.length];
    const [a,b,T]=n, per=T/b, ans=per*a;
    return {ask:`Now you try — what is <b>${a}/${b} of ${T}</b>?`,
            opts:[...new Set([ans,per,per*(a+1),T-ans,per*(a-1),T,T/2,ans+per].filter(v=>v>0&&Number.isInteger(v)))].slice(0,4),
            ans, next:n,
            why:`${T} ÷ ${b} = ${per}, then ${per} × ${a} = ${ans}.`,
            miss:`Divide first: ${T} ÷ ${b} = ${per}. Then multiply by the top number, ${a}.`};
  }
};

/* ============ 2. PERCENTAGES OF AN AMOUNT (maths day 2) ============== */
const PERCENT={
  title:"Percentages of an amount",
  presets:[[10,6.80,"£"],[20,6.80,"£"],[50,90,""],[80,300,"ml"],[25,60,"£"],[75,280,"£"]],
  label:p=>`${p[0]}% of ${p[2]==="£"?"£"+p[1].toFixed(2):p[1]}`,
  head(p){const [P,T,U]=p; return `<div class="sum">
      <span class="tot">${P}%</span><span class="of">of</span>
      <span class="tot">${money(T,U)}</span>
      <span class="eq hide" id="xEq">= ${money(T*P/100,U)}</span></div>`;},
  build(stage,p){
    const W=stage.clientWidth||330;
    const cell=Math.floor((W-9*3)/10);
    const size=Math.min(cell,30);
    stage.innerHTML="";
    stage.style.height=(size*10+9*3+26)+"px";
    for(let i=0;i<100;i++){
      const s=document.createElement("div");
      s.className="sq";
      s.style.cssText=`width:${size}px;height:${size}px;left:${(i%10)*(size+3)}px;top:${Math.floor(i/10)*(size+3)}px;transition-delay:${(i%10)*22}ms`;
      stage.appendChild(s);
    }
    const l=document.createElement("div");
    l.className="rowlab"; l.id="xRowLab";
    l.style.top=(size*10+9*3+4)+"px";
    stage.appendChild(l);
    stage._size=size;
  },
  steps(p){
    const [P,T,U]=p, row=T/10, ans=T*P/100;
    const full=Math.floor(P/10), rem=P%10;
    let build=`${row===Math.round(row)?row:row} times ${full} is ${Math.round(row*full*100)/100}`;
    let cap3=`${full} full ${full===1?"row":"rows"}`+(rem?` and half a row`:"");
    let say3=`That is ${full} full ${full===1?"row":"rows"}`+(rem?`, and half a row`:"")+`. `+
             `${sayMoney(row,U)} times ${full} is ${sayMoney(row*full,U)}`+
             (rem?`, plus half a row which is ${sayMoney(row/2,U)}`:"")+`. Altogether ${sayMoney(ans,U)}.`;
    return [
     {cap:`Here is the whole <b>${money(T,U)}</b>, drawn as <b>100 squares</b>.`,
      say:`Here is the whole amount, ${sayMoney(T,U)}, drawn as 100 squares.`},
     {cap:`10 rows, so <b>each row is 10%</b>. One row is ${money(T,U)} ÷ 10 = <b>${money(row,U)}</b>.`,
      say:`There are 10 rows, so each row is 10 per cent. To find one row, divide by 10. ${sayMoney(T,U)} divided by 10 is ${sayMoney(row,U)}. Always find 10 per cent first.`},
     {cap:`We need <b>${P}%</b>, so we colour in <b>${P} squares</b>.`,
      say:`We need ${P} per cent, so we colour in ${P} squares out of the hundred.`},
     {cap:`That is <b>${cap3}</b>.`, say:say3},
     {cap:`So <b>${P}% of ${money(T,U)} is ${money(ans,U)}</b>.`,
      say:`So ${P} per cent of ${sayMoney(T,U)} is ${sayMoney(ans,U)}.`},
     {cap:`Find <b>10% first</b> by dividing by 10. Then build up to the number you need.`,
      say:`Remember the trick. Find 10 per cent first by dividing by 10. Then build up. Double it for 20 per cent, halve it for 5 per cent. Never guess.`}
    ];
  },
  apply(stage,p,phase){
    const [P,T,U]=p, row=T/10;
    const sq=[...stage.querySelectorAll(".sq")];
    sq.forEach((s,i)=>{
      const rowN=Math.floor(i/10);
      s.classList.toggle("lit", phase>=2 && i<P);
      s.classList.toggle("rowlit", phase===1 && rowN===0);
      s.classList.toggle("dim", phase>=2 && i>=P);
    });
    const lab=el("xRowLab");
    if(lab) lab.innerHTML = phase===1?`one row = 10% = <b>${money(row,U)}</b>`
                          : phase>=3?`${P} squares coloured = <b>${money(T*P/100,U)}</b>`:"";
    const eq=el("xEq"); if(eq) eq.classList.toggle("hide",phase<4);
  },
  extra(p,phase){
    if(phase<5) return "";
    const [P,T,U]=p, row=T/10, ans=T*P/100;
    return `<div class="line draw"><span class="skyt">${money(T,U)} ÷ 10</span> = ${money(row,U)}  <span style="opacity:.6">(10%)</span></div>
            <div class="line l2 draw"><span class="hott">${money(row,U)} × ${P/10}</span> = <span class="grn">${money(ans,U)}</span></div>`;
  },
  quiz(p,all){
    const n=all[(all.findIndex(x=>x.join()===p.join())+1)%all.length];
    const [P,T,U]=n, ans=T*P/100, row=T/10;
    return {ask:`Now you try — what is <b>${P}% of ${money(T,U)}</b>?`,
            opts:[...new Set([money(ans,U),money(row,U),money(T-ans,U),money(ans+row,U),money(T,U),money(row*2,U)])].slice(0,4),
            ans:money(ans,U), next:n,
            why:`10% is ${money(row,U)}, and ${P}% is ${P/10} lots of that = ${money(ans,U)}.`,
            miss:`Find 10% first: ${money(T,U)} ÷ 10 = ${money(row,U)}. Then build up to ${P}%.`};
  }
};

/* ============ 3. AREA OF TRIANGLES AND PARALLELOGRAMS (day 13) ======= */
const AREA={
  title:"Area of triangles and parallelograms",
  presets:[["tri",8,10],["tri",6,4],["para",5,2],["para",6,3]],
  label:p=>`${p[0]==="tri"?"triangle":"parallelogram"} ${p[1]}×${p[2]}`,
  head(p){const [k,b,h]=p; const a=k==="tri"?b*h/2:b*h;
    return `<div class="sum"><span class="of">${k==="tri"?"Triangle":"Parallelogram"}</span>
      <span class="tot">${b}</span><span class="of">by</span><span class="tot">${h}</span>
      <span class="eq hide" id="xEq">= ${a} cm²</span></div>`;},
  build(stage,p){
    const [k,b,h]=p;
    const W=stage.clientWidth||330;
    const pad=34, sc=Math.min((W-pad*2)/(b+2), 150/(h+1), 34);
    const bw=b*sc, bh=h*sc;
    const ox=(W-bw)/2, oy=26;
    stage.style.height=(bh+80)+"px";
    const sl=k==="para"?Math.min(bw*0.45,sc*1.6):0;
    stage.innerHTML=`<svg id="xSvg" width="100%" height="${bh+80}" viewBox="0 0 ${W} ${bh+80}">
      <rect id="xRect" x="${ox}" y="${oy}" width="${bw}" height="${bh}" class="ghost"/>
      <polygon id="xB" class="shapeB" points="${k==="tri"
          ? `${ox},${oy} ${ox+bw},${oy} ${ox},${oy+bh}`
          : `${ox},${oy} ${ox+sl},${oy} ${ox+sl},${oy+bh} ${ox},${oy+bh}`}"/>
      <polygon id="xA" class="shapeA" points="${k==="tri"
          ? `${ox+bw},${oy} ${ox+bw},${oy+bh} ${ox},${oy+bh}`
          : `${ox+sl},${oy} ${ox+bw+sl},${oy} ${ox+bw},${oy+bh} ${ox},${oy+bh}`}"/>
      <line id="xCut" class="cut" x1="${ox+sl}" y1="${oy}" x2="${ox+sl}" y2="${oy+bh}"/>
      <line class="dim1" x1="${ox}" y1="${oy+bh+16}" x2="${ox+bw}" y2="${oy+bh+16}"/>
      <text class="dtxt" x="${ox+bw/2}" y="${oy+bh+34}" text-anchor="middle">base ${b} cm</text>
      <line class="dim1" x1="${ox-14}" y1="${oy}" x2="${ox-14}" y2="${oy+bh}"/>
      <text class="dtxt" x="${ox-18}" y="${oy+bh/2}" text-anchor="end" transform="rotate(-90 ${ox-18} ${oy+bh/2})">height ${h}</text>
      ${k==="para"?`<text class="trap" id="xTrap" x="${ox+bw+sl/2+6}" y="${oy+bh/2}">slanted side — not the height</text>`:""}
    </svg>`;
    stage._g={ox,oy,bw,bh,sl,sc};
  },
  steps(p){
    const [k,b,h]=p, box=b*h;
    if(k==="tri") return [
      {cap:`A triangle with base <b>${b} cm</b> and height <b>${h} cm</b>.`,
       say:`Here is a triangle. Its base is ${b} centimetres and its height is ${h} centimetres.`},
      {cap:`Draw a <b>rectangle</b> round it: ${b} × ${h} = <b>${box} cm²</b>.`,
       say:`First, draw a rectangle around it. ${b} times ${h} is ${box} square centimetres.`},
      {cap:`The leftover piece is <b>exactly the same size</b> as the triangle. Watch it spin over.`,
       say:`Now look at the piece left over. It is exactly the same size as the triangle. Watch it spin round and land right on top.`},
      {cap:`Two identical halves. So the triangle is <b>half the rectangle</b>.`,
       say:`Two identical halves. So a triangle is always half of the rectangle around it.`},
      {cap:`${box} ÷ 2 = <b>${box/2} cm²</b>.`,
       say:`${box} divided by 2 is ${box/2} square centimetres.`},
      {cap:`Base × height, <b>then halve it</b>. That is every triangle, always.`,
       say:`So the rule is: base times height, then halve it. That works for every triangle, always.`}
    ];
    return [
      {cap:`A parallelogram. Base <b>${b} cm</b>, straight-up height <b>${h} cm</b>.`,
       say:`Here is a parallelogram. The base is ${b} centimetres and the straight up height is ${h} centimetres. Careful — the slanted side is longer, and it is a trap.`},
      {cap:`<b>Cut</b> the triangle off this end.`,
       say:`Watch this. Cut the triangle off this end, straight down.`},
      {cap:`<b>Slide it round</b> to the other end.`,
       say:`Now slide that piece all the way round to the other end.`},
      {cap:`It is a <b>rectangle</b> now — same amount of space, easier shape.`,
       say:`And now it is a rectangle. Exactly the same amount of space, just an easier shape to work with.`},
      {cap:`${b} × ${h} = <b>${box} cm²</b>.`,
       say:`${b} times ${h} is ${box} square centimetres.`},
      {cap:`Base × <b>perpendicular</b> height. <b>Never</b> the slanted side.`,
       say:`So the rule is: base times the straight up height. Never the slanted side. And there is no halving — that is only for triangles.`}
    ];
  },
  apply(stage,p,phase){
    const [k,b,h]=p, g=stage._g;
    const rect=el("xRect"), A=el("xA"), B=el("xB"), cut=el("xCut"), trap=el("xTrap");
    const eq=el("xEq"); if(eq) eq.classList.toggle("hide",phase<4);
    if(!rect) return;
    if(k==="tri"){
      rect.style.opacity = phase>=1?1:0;
      B.style.opacity = phase>=2?1:0;
      B.style.transformOrigin=`${g.ox+g.bw/2}px ${g.oy+g.bh/2}px`;
      B.style.transform = phase>=3?"rotate(180deg)":"rotate(0deg)";
      cut.style.opacity = phase>=1&&phase<3?1:0;
      A.setAttribute("class","shapeA"+(phase>=4?" win":""));
    }else{
      rect.style.opacity = phase>=3?1:0;
      cut.style.opacity = phase>=1&&phase<3?1:0;
      B.style.opacity = 1;
      B.style.transform = phase>=2?`translateX(${g.bw}px)`:"translateX(0)";
      A.setAttribute("class","shapeA"+(phase>=4?" win":""));
      if(trap) trap.style.opacity = phase===0?1:0;
    }
  },
  extra(p,phase){
    if(phase<5) return "";
    const [k,b,h]=p;
    return k==="tri"
      ? `<div class="line draw"><span class="skyt">${b} × ${h}</span> = ${b*h}</div>
         <div class="line l2 draw"><span class="hott">${b*h} ÷ 2</span> = <span class="grn">${b*h/2} cm²</span></div>`
      : `<div class="line draw"><span class="skyt">base × perpendicular height</span></div>
         <div class="line l2 draw"><span class="hott">${b} × ${h}</span> = <span class="grn">${b*h} cm²</span></div>`;
  },
  quiz(p,all){
    const n=all[(all.findIndex(x=>x.join()===p.join())+1)%all.length];
    const [k,b,h]=n, ans=k==="tri"?b*h/2:b*h;
    const cand=[ans,b*h,b*h/2,b+h,b*h+h,b*(h+1),2*(b+h)].filter(v=>v>0);
    return {ask:`Now you try — the area of a <b>${k==="tri"?"triangle":"parallelogram"}</b> with base ${b} cm and height ${h} cm?`,
            opts:[...new Set(cand.map(v=>v+" cm²"))].slice(0,4),
            ans:ans+" cm²", next:n,
            why:k==="tri"?`${b} × ${h} = ${b*h}, then halve it: ${ans} cm².`:`${b} × ${h} = ${ans} cm². No halving for a parallelogram.`,
            miss:k==="tri"?`Multiply base by height, then halve it — a triangle is half its rectangle.`:`Base times the straight-up height. Do not halve it, and do not use the slanted side.`};
  }
};

const EXPLAINERS={"maths:1":FRACTIONS,"maths:2":PERCENT,"maths:13":AREA};

/* --------------------- explainer controller -------------------------- */
let X=null;
function openExplainer(def,dayN,backIdx){

function exShell(){

      <button class="rnd ${SOUND?"on":""}" id="xSnd" title="Sound">${SOUND?"🔊":"🔇"}</button>
      <button class="rnd" id="xAgain" title="Say that again">↻</button>
    </div>

  </div>

  el("xBack").onclick=()=>{hush();X.playing=false;brief(X.backIdx)};
  el("xPlay").onclick=()=>X.playing?exStop():exStart();
  el("xNext").onclick=()=>{exStop();exGo(X.phase+1)};
  el("xPrev").onclick=()=>{exStop();exGo(X.phase-1)};
  el("xAgain").onclick=()=>{hush();speak(X.def.steps(X.p)[X.phase].say)};
  el("xSnd").onclick=()=>{SOUND=!SOUND;el("xSnd").textContent=SOUND?"🔊":"🔇";el("xSnd").classList.toggle("on",SOUND);if(!SOUND)hush()};
  document.querySelectorAll("#xChips .chip").forEach(c=>c.onclick=()=>exLoad(X.def.presets[+c.dataset.i],true));
  d.build(el("xStage"),X.p);
